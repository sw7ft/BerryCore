<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    background: #02040a;
    color: #e8f2ff;
    font-family: "Courier New", Courier, monospace;
    padding: 22px 16px 40px;

  .bar { width: 56px; height: 3px; margin: 0 auto 14px; background: #1e90ff; }

  }
  .go { background: #0e2844; border-color: #4db8ff; color: #fff; }

<body>
  <div class="bar"></div>
  <h1>STT LAB</h1>

  <a class="go" href="/term/demo">Run official goforward clip (both engines)</a>
  <a href="/term/vosk">Vosk only — goforward</a>
  <a href="/term/rec?sec=3">Record 3 seconds (device mic)</a>
