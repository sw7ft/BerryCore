<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BerryMoto</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
  #gl { display:block; width:100%; height:100%; touch-action:none; }
  #hud {
    position:absolute; top:0; left:0; right:0;
    font-family:monospace; color:#fff; pointer-events:none;
    text-shadow:1px 1px 0 rgba(0,0,0,0.6);
  }
  #hud .title { position:absolute; top:6px; left:8px; font-size:11px; opacity:0.85; }
  #hud .stat  { position:absolute; top:6px; right:8px; font-size:12px; opacity:0.85; }
  #err {
    position:absolute; left:0; right:0; top:40%; text-align:center;
    color:#f66; font-family:monospace; font-size:14px; display:none; padding:0 20px;
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <div class="title">BerryMoto &#183; W gas &#183; S brake &#183; A/D steer &#183; I/K lean in the air &#183; match the landing!</div>
  <div class="stat" id="stat"></div>
</div>
<div id="err">WebGL not available on this device/browser.</div>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------
  // Compat shims (BB10 WebKit)
  // ---------------------------------------------------------------
  var raf = window.requestAnimationFrame ||
            window.webkitRequestAnimationFrame ||
            function (cb) { return setTimeout(function () { cb(now()); }, 16); };

  function now() {
    return (window.performance && window.performance.now)
      ? window.performance.now()
      : Date.now();
  }

  // ---------------------------------------------------------------
  // Canvas + GL
  // ---------------------------------------------------------------
  var canvas = document.getElementById("gl");
  var gl = null;
  var ctxNames = ["webgl", "experimental-webgl"];
  for (var ci = 0; ci < ctxNames.length && !gl; ci++) {
    try { gl = canvas.getContext(ctxNames[ci], { antialias: false }); } catch (e) {}
  }
  if (!gl) {
    document.getElementById("err").style.display = "block";
    return;
  }

  var MAX_DIM = 720;
  function resize() {
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.clientWidth  * dpr;
    var h = canvas.clientHeight * dpr;
    var scale = Math.min(1, MAX_DIM / Math.max(w, h));
    var bw = Math.max(1, Math.floor(w * scale));
    var bh = Math.max(1, Math.floor(h * scale));
    if (canvas.width !== bw || canvas.height !== bh) {
      canvas.width = bw;
      canvas.height = bh;
    }
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener("resize", resize, false);
  window.addEventListener("orientationchange", resize, false);

  // ---------------------------------------------------------------
  // Shaders
  // ---------------------------------------------------------------
  var VSH =
    "attribute vec3 aPos;\n" +
    "attribute vec2 aUV;\n" +
    "attribute float aShade;\n" +
    "uniform mat4 uProj;\n" +
    "uniform mat4 uView;\n" +
    "uniform mat4 uModel;\n" +
    "varying vec2 vUV;\n" +
    "varying float vShade;\n" +
    "varying float vDist;\n" +
    "void main() {\n" +
    "  vec4 eye = uView * uModel * vec4(aPos, 1.0);\n" +
    "  vDist = length(eye.xyz);\n" +
    "  vUV = aUV;\n" +
    "  vShade = aShade;\n" +
    "  gl_Position = uProj * eye;\n" +
    "}\n";

  var FSH =
    "precision mediump float;\n" +
    "uniform sampler2D uTex;\n" +
    "uniform vec3 uSky;\n" +
    "uniform float uFogStart;\n" +
    "uniform float uFogEnd;\n" +
    "varying vec2 vUV;\n" +
    "varying float vShade;\n" +
    "varying float vDist;\n" +
    "void main() {\n" +
    "  vec4 tex = texture2D(uTex, vUV);\n" +
    "  vec3 col = tex.rgb * vShade;\n" +
    "  float f = clamp((vDist - uFogStart) / (uFogEnd - uFogStart), 0.0, 1.0);\n" +
    "  gl_FragColor = vec4(mix(col, uSky, f), 1.0);\n" +
    "}\n";

  function makeShader(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(s) || "shader compile failed");
    }
    return s;
  }

  var prog = gl.createProgram();
  gl.attachShader(prog, makeShader(gl.VERTEX_SHADER, VSH));
  gl.attachShader(prog, makeShader(gl.FRAGMENT_SHADER, FSH));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(prog) || "link failed");
  }
  gl.useProgram(prog);

  var loc = {
    aPos:   gl.getAttribLocation(prog, "aPos"),
    aUV:    gl.getAttribLocation(prog, "aUV"),
    aShade: gl.getAttribLocation(prog, "aShade"),
    uProj:  gl.getUniformLocation(prog, "uProj"),
    uView:  gl.getUniformLocation(prog, "uView"),
    uModel: gl.getUniformLocation(prog, "uModel"),
    uTex:   gl.getUniformLocation(prog, "uTex"),
    uSky:   gl.getUniformLocation(prog, "uSky"),
    uFogStart: gl.getUniformLocation(prog, "uFogStart"),
    uFogEnd:   gl.getUniformLocation(prog, "uFogEnd")
  };

  // ---------------------------------------------------------------
  // Atlas
  // ---------------------------------------------------------------
  var TILE = 16;
  var ATLAS = 64;

  function rnd(seed) {
    var s = seed;
    return function () {
      s = (s * 1103515245 + 12345) & 0x7fffffff;
      return s / 0x7fffffff;
    };
  }
  function noiseTile(x, col, row, r, cr, cg, cb, lo, hi) {
    var i, j, v;
    for (j = 0; j < TILE; j++) for (i = 0; i < TILE; i++) {
      v = lo + r() * (hi - lo);
      x.fillStyle = "rgb(" + Math.floor(cr * v) + "," + Math.floor(cg * v) + "," + Math.floor(cb * v) + ")";
      x.fillRect(col * TILE + i, row * TILE + j, 1, 1);
    }
  }
  function buildAtlas() {
    var c = document.createElement("canvas");
    c.width = ATLAS; c.height = ATLAS;
    var x = c.getContext("2d");
    var r = rnd(1337);
    noiseTile(x, 0, 0, r, 78, 152, 58, 0.78, 1.0);   // grass
    noiseTile(x, 1, 0, r, 148, 104, 64, 0.72, 1.0);  // groomed dirt
    noiseTile(x, 2, 0, r, 40, 42, 46, 0.9, 1.0);     // dark steel
    noiseTile(x, 3, 0, r, 210, 55, 45, 0.9, 1.0);    // bike red
    noiseTile(x, 0, 2, r, 224, 172, 138, 0.92, 1.0); // rider skin
    noiseTile(x, 1, 2, r, 45, 90, 170, 0.85, 1.0);   // rider blue
    noiseTile(x, 2, 2, r, 25, 25, 28, 0.9, 1.0);     // tire black
    return c;
  }

  var tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, buildAtlas());
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  function tileUV(col, row) {
    var u0 = (col * TILE + 0.5) / ATLAS;
    var u1 = ((col + 1) * TILE - 0.5) / ATLAS;
    var v0 = (row * TILE + 0.5) / ATLAS;
    var v1 = ((row + 1) * TILE - 0.5) / ATLAS;
    return [u0, v0, u1, v1];
  }
  var UV_GRASS = tileUV(0, 0);
  var UV_DIRT  = tileUV(1, 0);
  var UV_DARK  = tileUV(2, 0);
  var UV_RED   = tileUV(3, 0);
  var UV_SKIN  = tileUV(0, 2);
  var UV_BLUE  = tileUV(1, 2);
  var UV_TIRE  = tileUV(2, 2);

  var SH_TOP = 1.0, SH_X = 0.8, SH_Z = 0.65, SH_BOT = 0.5;

  // ---------------------------------------------------------------
  // The motocross park: a smooth 96x96 heightfield built from a
  // designed feature list (rolling base, whoop strips, tabletops,
  // ridge jumps, one big hill). Cells touched by features are dirt.
  // ---------------------------------------------------------------
  var W = 96, D = 96;
  var GRID = (W + 1) * (D + 1);
  var HV = new Float32Array(GRID);    // vertex heights
  var FEAT = new Float32Array(GRID);  // feature intensity (for dirt)

  function gi(x, z) { return z * (W + 1) + x; }

  (function () {
    var x, z, i;
    for (z = 0; z <= D; z++) for (x = 0; x <= W; x++) {
      HV[gi(x, z)] = 0.6 * Math.sin(x * 0.045 + 1.0) * Math.sin(z * 0.05 + 2.0)
                   + 0.3 * Math.sin(x * 0.09 + 4.0) * Math.sin(z * 0.11 + 1.1)
                   + 2.0;
    }
    // Flat-top mound (tabletop jump): cone with a plateau.
    function tabletop(cx, cz, rad, hgt) {
      for (z = 0; z <= D; z++) for (x = 0; x <= W; x++) {
        var dx = x - cx, dz = z - cz;
        var d = Math.sqrt(dx * dx + dz * dz);
        if (d < rad) {
          var t = (rad - d) / (rad * 0.45);
          if (t > 1) t = 1;
          i = gi(x, z);
          HV[i] += hgt * t;
          FEAT[i] += t;
        }
      }
    }
    // Elongated ridge (a jump lip / roller).
    function ridge(cx, cz, rx, rz, hgt) {
      for (z = 0; z <= D; z++) for (x = 0; x <= W; x++) {
        var nx = (x - cx) / rx, nz = (z - cz) / rz;
        var d2 = nx * nx + nz * nz;
        if (d2 < 1) {
          var t = Math.cos(Math.sqrt(d2) * Math.PI * 0.5);
          i = gi(x, z);
          HV[i] += hgt * t * t;
          FEAT[i] += t;
        }
      }
    }
    // Whoop strip: high-frequency rollers in a rectangle.
    function whoops(x0, z0, x1, z1, amp, freq) {
      for (z = z0; z <= z1; z++) for (x = x0; x <= x1; x++) {
        var ex = Math.min(x - x0, x1 - x) / 3; if (ex > 1) ex = 1;
        var ez = Math.min(z - z0, z1 - z) / 3; if (ez > 1) ez = 1;
        i = gi(x, z);
        HV[i] += amp * (0.5 + 0.5 * Math.sin(x * freq)) * ex * ez;
        FEAT[i] += ex * ez;
      }
    }

    tabletop(30, 62, 6, 2.2);
    tabletop(62, 26, 5, 1.8);
    tabletop(72, 72, 7, 2.6);
    ridge(48, 40, 3.2, 9, 1.5);   // roller across the middle
    ridge(20, 30, 8, 3.0, 1.6);   // jump lip
    ridge(80, 48, 3.0, 10, 1.7);
    whoops(24, 78, 70, 86, 0.6, 1.05);
    tabletop(86, 12, 12, 3.2);    // the big hill corner
  })();

  function heightAt(x, z) {
    if (x < 0) x = 0; if (x > W - 0.001) x = W - 0.001;
    if (z < 0) z = 0; if (z > D - 0.001) z = D - 0.001;
    var x0 = Math.floor(x), z0 = Math.floor(z);
    var fx = x - x0, fz = z - z0;
    var h00 = HV[gi(x0, z0)],     h10 = HV[gi(x0 + 1, z0)];
    var h01 = HV[gi(x0, z0 + 1)], h11 = HV[gi(x0 + 1, z0 + 1)];
    var a = h00 + (h10 - h00) * fx;
    var b = h01 + (h11 - h01) * fx;
    return a + (b - a) * fz;
  }
  function hash(n) {
    var s = Math.sin(n * 127.1) * 43758.5453;
    return s - Math.floor(s);
  }

  // ---------------------------------------------------------------
  // Terrain mesh: per-cell quads with shared corner heights (smooth
  // silhouette) but per-face texture + lambert shade. Static.
  // ---------------------------------------------------------------
  var TVF = new Float32Array(240000);
  var TIX = new Uint16Array(60000);
  var tvN = 0, tiN = 0, tVerts = 0;

  function tQuad(ax,ay,az, bx,by,bz, cx,cy,cz, dx,dy,dz, uv, shade) {
    var u0 = uv[0], v0 = uv[1], u1 = uv[2], v1 = uv[3];
    var n = tvN;
    TVF[n]=ax; TVF[n+1]=ay; TVF[n+2]=az; TVF[n+3]=u0; TVF[n+4]=v0; TVF[n+5]=shade;
    TVF[n+6]=bx; TVF[n+7]=by; TVF[n+8]=bz; TVF[n+9]=u1; TVF[n+10]=v0; TVF[n+11]=shade;
    TVF[n+12]=cx; TVF[n+13]=cy; TVF[n+14]=cz; TVF[n+15]=u1; TVF[n+16]=v1; TVF[n+17]=shade;
    TVF[n+18]=dx; TVF[n+19]=dy; TVF[n+20]=dz; TVF[n+21]=u0; TVF[n+22]=v1; TVF[n+23]=shade;
    tvN += 24;
    TIX[tiN]   = tVerts;     TIX[tiN+1] = tVerts + 1; TIX[tiN+2] = tVerts + 2;
    TIX[tiN+3] = tVerts;     TIX[tiN+4] = tVerts + 2; TIX[tiN+5] = tVerts + 3;
    tiN += 6;
    tVerts += 4;
  }

  (function buildTerrain() {
    // Light direction for the lambert shade
    var lx = 0.46, ly = 0.81, lz = 0.36;
    var x, z;
    for (z = 0; z < D; z++) {
      for (x = 0; x < W; x++) {
        var h00 = HV[gi(x, z)],     h10 = HV[gi(x + 1, z)];
        var h01 = HV[gi(x, z + 1)], h11 = HV[gi(x + 1, z + 1)];
        // approximate face normal
        var nx = -(h10 - h00), ny = 1, nz = -(h01 - h00);
        var nl = Math.sqrt(nx * nx + ny * ny + nz * nz);
        var dp = (nx * lx + ny * ly + nz * lz) / nl;
        if (dp < 0) dp = 0;
        var shade = (0.55 + 0.5 * dp) * (0.94 + hash(x * 3.1 + z * 7.7) * 0.08);

        var feat = (FEAT[gi(x,z)] + FEAT[gi(x+1,z)] + FEAT[gi(x,z+1)] + FEAT[gi(x+1,z+1)]) * 0.25;
        var uv = feat > 0.15 ? UV_DIRT : UV_GRASS;

        // counter-clockwise from above, larger z edge first
        tQuad(x, h01, z + 1,  x + 1, h11, z + 1,  x + 1, h10, z,  x, h00, z,
              uv, shade);
      }
    }
    // boundary skirt
    var base = -1.0;
    for (x = 0; x < W; x++) {
      tQuad(x, base, D, x+1, base, D, x+1, HV[gi(x+1,D)], D, x, HV[gi(x,D)], D, UV_DIRT, SH_Z);
      tQuad(x+1, base, 0, x, base, 0, x, HV[gi(x,0)], 0, x+1, HV[gi(x+1,0)], 0, UV_DIRT, SH_Z);
    }
    for (z = 0; z < D; z++) {
      tQuad(W, base, z+1, W, base, z, W, HV[gi(W,z)], z, W, HV[gi(W,z+1)], z+1, UV_DIRT, SH_X);
      tQuad(0, base, z, 0, base, z+1, 0, HV[gi(0,z+1)], z+1, 0, HV[gi(0,z)], z, UV_DIRT, SH_X);
    }
  })();

  var tVbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, tVbo);
  gl.bufferData(gl.ARRAY_BUFFER, TVF.subarray(0, tvN), gl.STATIC_DRAW);
  var tIbo = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, tIbo);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, TIX.subarray(0, tiN), gl.STATIC_DRAW);
  var terrainIndexCount = tiN;

  // ---------------------------------------------------------------
  // Bike + rider mesh: frame/rider (one part), rear wheel, front
  // assembly (forks+bar, steers), front wheel (spins inside it).
  // Local forward = -Z. Origin at the ground contact midpoint.
  // ---------------------------------------------------------------
  var mVerts = [], mIdx = [], mCount = 0;
  function mQuad(p0, p1, p2, p3, uv, shade) {
    var us = [uv[0], uv[1],  uv[2], uv[1],  uv[2], uv[3],  uv[0], uv[3]];
    var ps = [p0, p1, p2, p3];
    for (var k = 0; k < 4; k++) {
      mVerts.push(ps[k][0], ps[k][1], ps[k][2], us[k * 2], us[k * 2 + 1], shade);
    }
    mIdx.push(mCount, mCount + 1, mCount + 2, mCount, mCount + 2, mCount + 3);
    mCount += 4;
  }
  function mBox(x0, y0, z0, x1, y1, z1, uv) {
    mQuad([x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0], uv, SH_TOP);
    mQuad([x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1], uv, SH_BOT);
    mQuad([x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1], uv, SH_Z);
    mQuad([x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0], uv, SH_Z);
    mQuad([x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1], uv, SH_X);
    mQuad([x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0], uv, SH_X);
  }
  function part() { return { start: mIdx.length, count: 0 }; }
  function endPart(p) { p.count = mIdx.length - p.start; }
  function wheelBoxes(r, w) {
    mBox(-w, -r, -r * 0.35, w, r, r * 0.35, UV_TIRE);
    mBox(-w, -r * 0.35, -r, w, r * 0.35, r, UV_TIRE);
  }

  var P_FRAME = part();
  mBox(-0.09, 0.55, -0.40, 0.09, 0.78, 0.42, UV_RED);   // tank + seat
  mBox(-0.07, 0.30, -0.15, 0.07, 0.55, 0.25, UV_DARK);  // engine
  mBox(-0.05, 0.30, 0.25, 0.05, 0.42, 0.62, UV_DARK);   // swingarm
  mBox(-0.11, 0.78, 0.02, 0.11, 1.16, 0.26, UV_BLUE);   // rider torso
  mBox(-0.08, 1.16, 0.03, 0.08, 1.32, 0.19, UV_SKIN);   // head
  mBox(-0.06, 0.42, -0.02, 0.06, 0.78, 0.16, UV_BLUE);  // legs blob
  endPart(P_FRAME);

  var P_RWHEEL = part();       // pivot at rear axle
  wheelBoxes(0.33, 0.05);
  endPart(P_RWHEEL);

  var P_FASM = part();         // pivot at head tube; steers about Y
  mBox(-0.045, -0.62, -0.10, 0.045, 0.02, -0.02, UV_DARK); // fork
  mBox(-0.30, 0.02, -0.10, 0.30, 0.09, -0.02, UV_DARK);    // bar
  endPart(P_FASM);

  var P_FWHEEL = part();       // pivot at front axle (child of FASM)
  wheelBoxes(0.33, 0.045);
  endPart(P_FWHEEL);

  var mVbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, mVbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(mVerts), gl.STATIC_DRAW);
  var mIbo = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mIbo);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(mIdx), gl.STATIC_DRAW);

  var STRIDE = 6 * 4;
  function bindBuffers(vb, ib) {
    gl.bindBuffer(gl.ARRAY_BUFFER, vb);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
    gl.vertexAttribPointer(loc.aPos, 3, gl.FLOAT, false, STRIDE, 0);
    gl.vertexAttribPointer(loc.aUV, 2, gl.FLOAT, false, STRIDE, 12);
    gl.vertexAttribPointer(loc.aShade, 1, gl.FLOAT, false, STRIDE, 20);
  }
  gl.enableVertexAttribArray(loc.aPos);
  gl.enableVertexAttribArray(loc.aUV);
  gl.enableVertexAttribArray(loc.aShade);

  // ---------------------------------------------------------------
  // mat4
  // ---------------------------------------------------------------
  function mat4() { var m = new Float32Array(16); m[0]=m[5]=m[10]=m[15]=1; return m; }
  var mulTmp = new Float32Array(16);
  function mul(out, a, b) {
    var r, c, i, s;
    for (c = 0; c < 4; c++) for (r = 0; r < 4; r++) {
      s = 0;
      for (i = 0; i < 4; i++) s += a[i * 4 + r] * b[c * 4 + i];
      mulTmp[c * 4 + r] = s;
    }
    for (i = 0; i < 16; i++) out[i] = mulTmp[i];
  }
  function setTRY(out, tx, ty, tz, yaw) {
    var cy = Math.cos(yaw), sy = Math.sin(yaw);
    out[0]=cy;  out[1]=0; out[2]=-sy; out[3]=0;
    out[4]=0;   out[5]=1; out[6]=0;   out[7]=0;
    out[8]=sy;  out[9]=0; out[10]=cy; out[11]=0;
    out[12]=tx; out[13]=ty; out[14]=tz; out[15]=1;
  }
  function setTRX(out, tx, ty, tz, ang) {
    var c = Math.cos(ang), s = Math.sin(ang);
    out[0]=1; out[1]=0;  out[2]=0;  out[3]=0;
    out[4]=0; out[5]=c;  out[6]=s;  out[7]=0;
    out[8]=0; out[9]=-s; out[10]=c; out[11]=0;
    out[12]=tx; out[13]=ty; out[14]=tz; out[15]=1;
  }
  function setRX(out, ang) { setTRX(out, 0, 0, 0, ang); }
  function setRZ(out, ang) {
    var c = Math.cos(ang), s = Math.sin(ang);
    out[0]=c;  out[1]=s; out[2]=0; out[3]=0;
    out[4]=-s; out[5]=c; out[6]=0; out[7]=0;
    out[8]=0;  out[9]=0; out[10]=1; out[11]=0;
    out[12]=0; out[13]=0; out[14]=0; out[15]=1;
  }
  function perspective(out, fovy, aspect, near, far) {
    var f = 1 / Math.tan(fovy / 2);
    var nf = 1 / (near - far);
    out[0]=f/aspect; out[1]=0; out[2]=0;              out[3]=0;
    out[4]=0;        out[5]=f; out[6]=0;              out[7]=0;
    out[8]=0;        out[9]=0; out[10]=(far+near)*nf; out[11]=-1;
    out[12]=0;       out[13]=0;out[14]=2*far*near*nf; out[15]=0;
  }
  function viewMatrix(out, ex, ey, ez, yaw, pitch) {
    var cy = Math.cos(yaw),  sy = Math.sin(yaw);
    var cp = Math.cos(pitch), sp = Math.sin(pitch);
    var rx = [cy, sy * sp, sy * cp];
    var ry = [0,  cp,     -sp];
    var rz = [-sy, cy * sp, cy * cp];
    out[0]=rx[0]; out[1]=rx[1]; out[2]=rx[2];  out[3]=0;
    out[4]=ry[0]; out[5]=ry[1]; out[6]=ry[2];  out[7]=0;
    out[8]=rz[0]; out[9]=rz[1]; out[10]=rz[2]; out[11]=0;
    out[12]=-(rx[0]*ex + ry[0]*ey + rz[0]*ez);
    out[13]=-(rx[1]*ex + ry[1]*ey + rz[1]*ez);
    out[14]=-(rx[2]*ex + ry[2]*ey + rz[2]*ez);
    out[15]=1;
  }

  var proj = mat4();
  var view = mat4();
  var identity = mat4();
  var bikeMat = mat4();
  var tmpA = mat4();
  var tmpB = mat4();
  var fasmMat = mat4();
  var wheelMat = mat4();

  // ---------------------------------------------------------------
  // Bike state + physics
  // ---------------------------------------------------------------
  var bike = {
    x: 48, z: 48, y: 0,
    yaw: 0,
    v: 0, vy: 0,
    grounded: true,
    pitch: 0,          // player-controlled in the air
    roll: 0,
    wheelPhase: 0,
    airTime: 0
  };
  bike.y = heightAt(bike.x, bike.z);

  var G = 14;
  var VMAX = 14, ACCEL = 8, BRAKE = 14, DRAG = 0.55;
  var YAW_RATE = 2.0, LEAN_RATE = 2.4;
  var bestAir = 0;
  var flash = 0, flashMsg = "";

  var hPrev = bike.y;

  function slopeAlong(x, z, yaw) {
    var fx = -Math.sin(yaw), fz = -Math.cos(yaw);
    var a = heightAt(x - fx * 0.6, z - fz * 0.6);
    var b = heightAt(x + fx * 0.6, z + fz * 0.6);
    return Math.atan2(b - a, 1.2);
  }

  function updateBike(dt, inp) {
    var gp = slopeAlong(bike.x, bike.z, bike.yaw);

    if (bike.grounded) {
      // Drive
      if (inp.thr > 0)      bike.v += inp.thr * ACCEL * dt;
      else if (inp.thr < 0) bike.v += inp.thr * BRAKE * dt;
      bike.v -= bike.v * DRAG * dt;
      bike.v -= Math.sin(gp) * 6 * dt;      // hills cost / give speed
      bike.v = inp.thr < 0 ? Math.max(0, bike.v) : Math.min(VMAX, Math.max(0, bike.v));

      var authority = 0.3 + 0.7 * Math.min(1, bike.v / 4);
      bike.yaw -= inp.steer * YAW_RATE * authority * dt;

      // On the ground the bike pitches with the terrain.
      bike.pitch += (gp - bike.pitch) * Math.min(1, 10 * dt);
    } else {
      // Air: lean control, faint steering, no thrust.
      bike.pitch = Math.max(-1.1, Math.min(1.1,
        bike.pitch + inp.lean * LEAN_RATE * dt));
      bike.yaw -= inp.steer * YAW_RATE * 0.18 * dt;
      bike.airTime += dt;
    }

    // Move along heading
    var fx = -Math.sin(bike.yaw), fz = -Math.cos(bike.yaw);
    bike.x += fx * bike.v * dt;
    bike.z += fz * bike.v * dt;
    if (bike.x < 2)      { bike.x = 2;      bike.v *= 0.6; }
    if (bike.x > W - 2)  { bike.x = W - 2;  bike.v *= 0.6; }
    if (bike.z < 2)      { bike.z = 2;      bike.v *= 0.6; }
    if (bike.z > D - 2)  { bike.z = D - 2;  bike.v *= 0.6; }

    // Vertical: always ballistic; the ground catches you. While
    // grounded the terrain's own vertical velocity feeds vy, so a
    // ramp that ends launches you with the speed it gave you.
    bike.vy -= G * dt;
    bike.y += bike.vy * dt;
    var h = heightAt(bike.x, bike.z);

    if (bike.y <= h) {
      var wasAir = !bike.grounded;
      var terrVy = (h - hPrev) / dt;
      bike.y = h;
      if (bike.vy < terrVy) bike.vy = terrVy;
      if (bike.vy > 12) bike.vy = 12;

      if (wasAir && bike.airTime > 0.25) {
        // Landing judgement: match your pitch to the slope.
        var miss = Math.abs(bike.pitch - gp);
        if (miss < 0.3) {
          flashMsg = "CLEAN!"; flash = 1.0;
        } else if (miss < 0.75) {
          bike.v *= 1 - miss * 0.55;
          flashMsg = "sketchy"; flash = 1.0;
        } else {
          bike.v *= 0.15;
          flashMsg = "WRECKED"; flash = 1.4;
        }
        if (bike.airTime > bestAir) bestAir = bike.airTime;
      }
      bike.grounded = true;
      bike.airTime = 0;
    } else if (bike.y > h + 0.02) {
      bike.grounded = false;
    }
    hPrev = h;

    // Lean into turns on the ground; stay flat-ish in the air.
    var targetRoll = bike.grounded
      ? -inp.steer * Math.min(1, bike.v / 6) * 0.45
      : bike.roll * 0.9;
    bike.roll += (targetRoll - bike.roll) * Math.min(1, 8 * dt);

    bike.wheelPhase += (bike.v / 0.33) * dt *
      (bike.grounded ? 1 : (inp.thr > 0 ? 1.6 : 0.2));

    if (flash > 0) flash -= dt;
  }

  // ---------------------------------------------------------------
  // Keyboard (BB10 multi-path)
  // ---------------------------------------------------------------
  var keyHeld = {};
  var keyExpiry = {};
  var PRESS_HOLD_MS = 300;

  function mapCode(code) {
    switch (code) {
      case 87: case 119: return "thr";     // W
      case 83: case 115: return "brake";   // S
      case 65: case 97:  case 74: case 106: case 37: return "left";  // A J Left
      case 68: case 100: case 76: case 108: case 39: return "right"; // D L Right
      case 73: case 105: case 38: return "leanF"; // I, Up = nose down
      case 75: case 107: case 40: return "leanB"; // K, Down = nose up
    }
    return null;
  }
  function mapKeyEvent(e) {
    var name = null;
    if (e.key) {
      switch (e.key) {
        case "w": case "W": name = "thr"; break;
        case "s": case "S": name = "brake"; break;
        case "a": case "A": case "j": case "J":
        case "ArrowLeft": case "Left": name = "left"; break;
        case "d": case "D": case "l": case "L":
        case "ArrowRight": case "Right": name = "right"; break;
        case "i": case "I": case "ArrowUp": case "Up": name = "leanF"; break;
        case "k": case "K": case "ArrowDown": case "Down": name = "leanB"; break;
      }
    }
    if (!name && e.keyIdentifier) {
      var ki = e.keyIdentifier;
      if (ki.indexOf("U+") === 0) name = mapCode(parseInt(ki.slice(2), 16));
      else if (ki === "Left")  name = "left";
      else if (ki === "Right") name = "right";
      else if (ki === "Up")    name = "leanF";
      else if (ki === "Down")  name = "leanB";
    }
    if (!name && e.keyCode) name = mapCode(e.keyCode);
    return name;
  }

  document.addEventListener("keydown", function (e) {
    var name = mapKeyEvent(e);
    if (name) {
      keyHeld[name] = true;
      keyExpiry[name] = now() + PRESS_HOLD_MS;
      if (e.preventDefault) e.preventDefault();
    }
  }, false);
  document.addEventListener("keyup", function (e) {
    var name = mapKeyEvent(e);
    if (name) {
      keyHeld[name] = false;
      keyExpiry[name] = 0;
    }
  }, false);
  document.addEventListener("keypress", function (e) {
    var name = mapCode(e.charCode || e.keyCode || 0);
    if (name) {
      keyExpiry[name] = now() + PRESS_HOLD_MS;
      if (e.preventDefault) e.preventDefault();
    }
  }, false);
  window.addEventListener("blur", function () {
    keyHeld = {};
    keyExpiry = {};
  }, false);
  function isDown(name) {
    if (keyHeld[name]) return true;
    var exp = keyExpiry[name];
    return !!exp && exp > now();
  }

  // ---------------------------------------------------------------
  // Touch/mouse: left stick = gas/brake (dy) + steer (dx);
  // right stick = lean (dy) + extra steer (dx).
  // ---------------------------------------------------------------
  var leftStick = null, rightStick = null;
  var STICK_RANGE = 60;

  function findTouch(list, id) {
    for (var i = 0; i < list.length; i++) {
      if (list[i].identifier === id) return list[i];
    }
    return null;
  }
  canvas.addEventListener("touchstart", function (e) {
    e.preventDefault();
    var half = canvas.clientWidth / 2;
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.clientX < half && !leftStick) {
        leftStick = { id: t.identifier, sx: t.clientX, sy: t.clientY, dx: 0, dy: 0 };
      } else if (t.clientX >= half && !rightStick) {
        rightStick = { id: t.identifier, sx: t.clientX, sy: t.clientY, dx: 0, dy: 0 };
      }
    }
  }, false);
  canvas.addEventListener("touchmove", function (e) {
    e.preventDefault();
    var t;
    if (leftStick) {
      t = findTouch(e.touches, leftStick.id);
      if (t) { leftStick.dx = t.clientX - leftStick.sx; leftStick.dy = t.clientY - leftStick.sy; }
    }
    if (rightStick) {
      t = findTouch(e.touches, rightStick.id);
      if (t) { rightStick.dx = t.clientX - rightStick.sx; rightStick.dy = t.clientY - rightStick.sy; }
    }
  }, false);
  function endTouches(e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var id = e.changedTouches[i].identifier;
      if (leftStick && leftStick.id === id) leftStick = null;
      if (rightStick && rightStick.id === id) rightStick = null;
    }
  }
  canvas.addEventListener("touchend", endTouches, false);
  canvas.addEventListener("touchcancel", endTouches, false);

  var mouseStick = null;
  canvas.addEventListener("mousedown", function (e) {
    if (e.preventDefault) e.preventDefault();
    var half = canvas.clientWidth / 2;
    if (e.clientX < half && !leftStick) {
      leftStick = { id: "mouse", sx: e.clientX, sy: e.clientY, dx: 0, dy: 0 };
      mouseStick = "left";
    } else if (e.clientX >= half && !rightStick) {
      rightStick = { id: "mouse", sx: e.clientX, sy: e.clientY, dx: 0, dy: 0 };
      mouseStick = "right";
    }
  }, false);
  document.addEventListener("mouseup", function () {
    if (mouseStick === "left" && leftStick && leftStick.id === "mouse") leftStick = null;
    if (mouseStick === "right" && rightStick && rightStick.id === "mouse") rightStick = null;
    mouseStick = null;
  }, false);
  document.addEventListener("mousemove", function (e) {
    if (mouseStick === "left" && leftStick && leftStick.id === "mouse") {
      leftStick.dx = e.clientX - leftStick.sx; leftStick.dy = e.clientY - leftStick.sy;
    } else if (mouseStick === "right" && rightStick && rightStick.id === "mouse") {
      rightStick.dx = e.clientX - rightStick.sx; rightStick.dy = e.clientY - rightStick.sy;
    }
  }, false);
  canvas.addEventListener("contextmenu", function (e) {
    if (e.preventDefault) e.preventDefault();
  }, false);

  function clampf(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  function readInput() {
    var thr = 0, steer = 0, lean = 0;
    if (isDown("thr"))   thr += 1;
    if (isDown("brake")) thr -= 1;
    if (isDown("left"))  steer -= 1;
    if (isDown("right")) steer += 1;
    if (isDown("leanF")) lean -= 1;   // nose down
    if (isDown("leanB")) lean += 1;   // nose up
    if (leftStick) {
      thr   += clampf(-leftStick.dy / STICK_RANGE, -1, 1);
      steer += clampf( leftStick.dx / STICK_RANGE, -1, 1);
    }
    if (rightStick) {
      lean  += clampf(-rightStick.dy / STICK_RANGE, -1, 1);
      steer += clampf( rightStick.dx / STICK_RANGE, -1, 1);
    }
    return {
      thr: clampf(thr, -1, 1),
      steer: clampf(steer, -1, 1),
      lean: clampf(lean, -1, 1)
    };
  }

  // ---------------------------------------------------------------
  // Main loop
  // ---------------------------------------------------------------
  var SKY = [0.55, 0.75, 0.95];
  gl.clearColor(SKY[0], SKY[1], SKY[2], 1);
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);

  gl.uniform1i(loc.uTex, 0);
  gl.uniform3f(loc.uSky, SKY[0], SKY[1], SKY[2]);
  gl.uniform1f(loc.uFogStart, 34.0);
  gl.uniform1f(loc.uFogEnd, 68.0);

  var statEl = document.getElementById("stat");
  var frames = 0, fpsTime = 0, lastFps = 0, statTime = 0;
  var last = now();
  var camYaw = bike.yaw;

  function drawPart(p, m) {
    gl.uniformMatrix4fv(loc.uModel, false, m);
    gl.drawElements(gl.TRIANGLES, p.count, gl.UNSIGNED_SHORT, p.start * 2);
  }

  function frame() {
    var t = now();
    var dt = (t - last) / 1000;
    last = t;
    if (dt > 0.1) dt = 0.1;

    resize();
    var inp = readInput();
    updateBike(dt, inp);

    // Chase camera
    var dyaw = bike.yaw - camYaw;
    while (dyaw >  Math.PI) dyaw -= 2 * Math.PI;
    while (dyaw < -Math.PI) dyaw += 2 * Math.PI;
    camYaw += dyaw * Math.min(1, 4.5 * dt);

    var CAM_DIST = 6.0, CAM_PITCH = -0.26;
    var ccp = Math.cos(CAM_PITCH), csp = Math.sin(CAM_PITCH);
    var cfx = -Math.sin(camYaw) * ccp;
    var cfy = csp;
    var cfz = -Math.cos(camYaw) * ccp;
    var ex = bike.x - cfx * CAM_DIST;
    var ey = (bike.y + 1.3) - cfy * CAM_DIST;
    var ez = bike.z - cfz * CAM_DIST;
    var hCam = heightAt(ex, ez);
    if (ey < hCam + 0.8) ey = hCam + 0.8;

    perspective(proj, 72 * Math.PI / 180, canvas.width / canvas.height, 0.1, 140);
    viewMatrix(view, ex, ey, ez, camYaw, CAM_PITCH);

    gl.uniformMatrix4fv(loc.uProj, false, proj);
    gl.uniformMatrix4fv(loc.uView, false, view);

    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    // Terrain
    bindBuffers(tVbo, tIbo);
    gl.uniformMatrix4fv(loc.uModel, false, identity);
    gl.drawElements(gl.TRIANGLES, terrainIndexCount, gl.UNSIGNED_SHORT, 0);

    // Bike: T * Ry(yaw) * Rx(pitch) * Rz(roll)
    bindBuffers(mVbo, mIbo);
    setTRY(bikeMat, bike.x, bike.y, bike.z, bike.yaw);
    setRX(tmpA, bike.pitch);
    mul(tmpB, bikeMat, tmpA);
    setRZ(tmpA, bike.roll);
    mul(bikeMat, tmpB, tmpA);

    drawPart(P_FRAME, bikeMat);

    setTRX(wheelMat, 0, 0.33, 0.55, bike.wheelPhase);
    mul(tmpA, bikeMat, wheelMat);
    drawPart(P_RWHEEL, tmpA);

    var steerVis = -inp.steer * 0.35;
    setTRY(fasmMat, 0, 0.95, -0.50, steerVis);
    mul(tmpB, bikeMat, fasmMat);
    drawPart(P_FASM, tmpB);

    setTRX(wheelMat, 0, -0.62, -0.10, bike.wheelPhase);
    mul(tmpA, tmpB, wheelMat);
    drawPart(P_FWHEEL, tmpA);

    // HUD
    frames++;
    fpsTime += dt;
    statTime += dt;
    if (fpsTime >= 1) { lastFps = frames; frames = 0; fpsTime = 0; }
    if (statTime >= 0.2) {
      statTime = 0;
      var airStr = bike.grounded
        ? "best air " + bestAir.toFixed(2) + "s"
        : "AIR " + bike.airTime.toFixed(2) + "s";
      statEl.innerHTML = (flash > 0 ? flashMsg + " &#183; " : "") +
        lastFps + " fps &#183; spd " + bike.v.toFixed(1) + " &#183; " + airStr;
    }

    raf(frame);
  }

  resize();
  raf(frame);
})();
</script>
</body>
</html>
