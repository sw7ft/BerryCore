<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BerryBoat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
  #gl { display:block; width:100%; height:100%; touch-action:none; }
  #hud {
    position:absolute; top:0; left:0; right:0;
    font-family:monospace; color:#fff; pointer-events:none;
    text-shadow:1px 1px 0 rgba(0,0,0,0.6);
  }
  #hud .title { position:absolute; top:6px; left:8px; font-size:12px; opacity:0.85; }
  #hud .stat  { position:absolute; top:6px; right:8px; font-size:12px; opacity:0.85; }
  #err {
    position:absolute; left:0; right:0; top:40%; text-align:center;
    color:#f66; font-family:monospace; font-size:14px; display:none; padding:0 20px;
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <div class="title">BerryBoat &#183; A/D steer &#183; W/S throttle &#183; drag = stick &#183; dodge the rocks</div>
  <div class="stat" id="stat"></div>
</div>
<div id="err">WebGL not available on this device/browser.</div>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------
  // Compat shims (BB10 WebKit)
  // ---------------------------------------------------------------
  var raf = window.requestAnimationFrame ||
            window.webkitRequestAnimationFrame ||
            function (cb) { return setTimeout(function () { cb(now()); }, 16); };

  function now() {
    return (window.performance && window.performance.now)
      ? window.performance.now()
      : Date.now();
  }

  // ---------------------------------------------------------------
  // Canvas + GL
  // ---------------------------------------------------------------
  var canvas = document.getElementById("gl");
  var gl = null;
  var ctxNames = ["webgl", "experimental-webgl"];
  for (var ci = 0; ci < ctxNames.length && !gl; ci++) {
    try { gl = canvas.getContext(ctxNames[ci], { antialias: false }); } catch (e) {}
  }
  if (!gl) {
    document.getElementById("err").style.display = "block";
    return;
  }

  var MAX_DIM = 720;
  function resize() {
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.clientWidth  * dpr;
    var h = canvas.clientHeight * dpr;
    var scale = Math.min(1, MAX_DIM / Math.max(w, h));
    var bw = Math.max(1, Math.floor(w * scale));
    var bh = Math.max(1, Math.floor(h * scale));
    if (canvas.width !== bw || canvas.height !== bh) {
      canvas.width = bw;
      canvas.height = bh;
    }
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener("resize", resize, false);
  window.addEventListener("orientationchange", resize, false);

  // ---------------------------------------------------------------
  // Shaders. Water shimmer trick: water vertices carry a NEGATIVE
  // shade; the vertex shader flips it positive and adds a moving
  // sine ripple, so water animates with zero extra draw calls.
  // ---------------------------------------------------------------
  var VSH =
    "attribute vec3 aPos;\n" +
    "attribute vec2 aUV;\n" +
    "attribute float aShade;\n" +
    "uniform mat4 uProj;\n" +
    "uniform mat4 uView;\n" +
    "uniform mat4 uModel;\n" +
    "uniform float uTime;\n" +
    "varying vec2 vUV;\n" +
    "varying float vShade;\n" +
    "varying float vDist;\n" +
    "void main() {\n" +
    "  vec4 eye = uView * uModel * vec4(aPos, 1.0);\n" +
    "  vDist = length(eye.xyz);\n" +
    "  vUV = aUV;\n" +
    "  float sh = aShade;\n" +
    "  if (sh < 0.0) {\n" +
    "    sh = -sh + 0.10 * sin(uTime * 2.6 + aPos.x * 1.4 + aPos.z * 0.8);\n" +
    "  }\n" +
    "  vShade = sh;\n" +
    "  gl_Position = uProj * eye;\n" +
    "}\n";

  var FSH =
    "precision mediump float;\n" +
    "uniform sampler2D uTex;\n" +
    "uniform vec3 uSky;\n" +
    "uniform float uFogStart;\n" +
    "uniform float uFogEnd;\n" +
    "varying vec2 vUV;\n" +
    "varying float vShade;\n" +
    "varying float vDist;\n" +
    "void main() {\n" +
    "  vec4 tex = texture2D(uTex, vUV);\n" +
    "  vec3 col = tex.rgb * vShade;\n" +
    "  float f = clamp((vDist - uFogStart) / (uFogEnd - uFogStart), 0.0, 1.0);\n" +
    "  gl_FragColor = vec4(mix(col, uSky, f), 1.0);\n" +
    "}\n";

  function makeShader(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(s) || "shader compile failed");
    }
    return s;
  }

  var prog = gl.createProgram();
  gl.attachShader(prog, makeShader(gl.VERTEX_SHADER, VSH));
  gl.attachShader(prog, makeShader(gl.FRAGMENT_SHADER, FSH));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(prog) || "link failed");
  }
  gl.useProgram(prog);

  var loc = {
    aPos:   gl.getAttribLocation(prog, "aPos"),
    aUV:    gl.getAttribLocation(prog, "aUV"),
    aShade: gl.getAttribLocation(prog, "aShade"),
    uProj:  gl.getUniformLocation(prog, "uProj"),
    uView:  gl.getUniformLocation(prog, "uView"),
    uModel: gl.getUniformLocation(prog, "uModel"),
    uTime:  gl.getUniformLocation(prog, "uTime"),
    uTex:   gl.getUniformLocation(prog, "uTex"),
    uSky:   gl.getUniformLocation(prog, "uSky"),
    uFogStart: gl.getUniformLocation(prog, "uFogStart"),
    uFogEnd:   gl.getUniformLocation(prog, "uFogEnd")
  };

  // ---------------------------------------------------------------
  // Atlas
  // ---------------------------------------------------------------
  var TILE = 16;
  var ATLAS = 64;

  function rnd(seed) {
    var s = seed;
    return function () {
      s = (s * 1103515245 + 12345) & 0x7fffffff;
      return s / 0x7fffffff;
    };
  }

  function noiseTile(x, col, row, r, cr, cg, cb, lo, hi) {
    var i, j, v;
    for (j = 0; j < TILE; j++) for (i = 0; i < TILE; i++) {
      v = lo + r() * (hi - lo);
      x.fillStyle = "rgb(" + Math.floor(cr * v) + "," + Math.floor(cg * v) + "," + Math.floor(cb * v) + ")";
      x.fillRect(col * TILE + i, row * TILE + j, 1, 1);
    }
  }

  function buildAtlas() {
    var c = document.createElement("canvas");
    c.width = ATLAS; c.height = ATLAS;
    var x = c.getContext("2d");
    var r = rnd(1337);
    var i, j, v;

    // (0,0) grass top
    noiseTile(x, 0, 0, r, 70, 160, 60, 0.75, 1.0);
    // (1,0) grass side
    for (j = 0; j < TILE; j++) for (i = 0; i < TILE; i++) {
      v = 0.7 + r() * 0.3;
      if (j < 3 || (j === 3 && r() > 0.5)) {
        x.fillStyle = "rgb(" + Math.floor(75 * v) + "," + Math.floor(150 * v) + "," + Math.floor(55 * v) + ")";
      } else {
        x.fillStyle = "rgb(" + Math.floor(134 * v) + "," + Math.floor(96 * v) + "," + Math.floor(67 * v) + ")";
      }
      x.fillRect(TILE + i, j, 1, 1);
    }
    // (2,0) dirt, (3,0) stone
    noiseTile(x, 2, 0, r, 134, 96, 67, 0.7, 1.0);
    noiseTile(x, 3, 0, r, 128, 128, 128, 0.75, 1.0);
    // (0,2) wood, (1,2) red, (2,2) dark, (3,2) water
    noiseTile(x, 0, 2, r, 150, 108, 60, 0.8, 1.0);
    noiseTile(x, 1, 2, r, 210, 60, 50, 0.9, 1.0);
    noiseTile(x, 2, 2, r, 30, 30, 34, 0.9, 1.0);
    noiseTile(x, 3, 2, r, 50, 115, 200, 0.82, 1.0);
    return c;
  }

  var tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, buildAtlas());
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  function tileUV(col, row) {
    var u0 = (col * TILE + 0.5) / ATLAS;
    var u1 = ((col + 1) * TILE - 0.5) / ATLAS;
    var v0 = (row * TILE + 0.5) / ATLAS;
    var v1 = ((row + 1) * TILE - 0.5) / ATLAS;
    return [u0, v0, u1, v1];
  }
  var UV_GRASS_TOP  = tileUV(0, 0);
  var UV_GRASS_SIDE = tileUV(1, 0);
  var UV_STONE      = tileUV(3, 0);
  var UV_WOOD       = tileUV(0, 2);
  var UV_RED        = tileUV(1, 2);
  var UV_DARK       = tileUV(2, 2);
  var UV_WATER      = tileUV(3, 2);

  var SH_TOP = 1.0, SH_X = 0.8, SH_Z = 0.65, SH_BOT = 0.5;

  // ---------------------------------------------------------------
  // The river. Fully deterministic functions of distance, so the
  // world needs no storage and regenerates identically forever.
  // The boat travels in -Z; "row" r covers world z in [-(r+1), -r].
  // ---------------------------------------------------------------
  var WATER_Y = 0.62;

  function riverCenter(d) {
    return 6 * Math.sin(d * 0.021) +
           9 * Math.sin(d * 0.0093 + 2.1) +
           3 * Math.sin(d * 0.047 + 4.0);
  }
  function halfWidth(d) {
    return 3.6 + 1.4 * Math.sin(d * 0.011 + 1.0);
  }
  function hash(n) {
    var s = Math.sin(n * 127.1) * 43758.5453;
    return s - Math.floor(s);
  }

  // ---------------------------------------------------------------
  // Dynamic terrain: a sliding window of rows rebuilt into
  // preallocated typed arrays (no per-rebuild GC garbage), uploaded
  // with DYNAMIC_DRAW. Rebuilds every 12 rows of travel.
  // ---------------------------------------------------------------
  var ROWS = 72;      // rows in the window
  var COLS = 33;      // columns across the valley
  var TVF = new Float32Array(150000);
  var TIX = new Uint16Array(36000);
  var tvN = 0, tiN = 0, tVerts = 0;
  var terrainIndexCount = 0;
  var rocks = [];     // {x, r, hit}

  function tQuad(ax,ay,az, bx,by,bz, cx,cy,cz, dx,dy,dz, uv, shade) {
    var u0 = uv[0], v0 = uv[1], u1 = uv[2], v1 = uv[3];
    var n = tvN;
    TVF[n]=ax; TVF[n+1]=ay; TVF[n+2]=az; TVF[n+3]=u0; TVF[n+4]=v0; TVF[n+5]=shade;
    TVF[n+6]=bx; TVF[n+7]=by; TVF[n+8]=bz; TVF[n+9]=u1; TVF[n+10]=v0; TVF[n+11]=shade;
    TVF[n+12]=cx; TVF[n+13]=cy; TVF[n+14]=cz; TVF[n+15]=u1; TVF[n+16]=v1; TVF[n+17]=shade;
    TVF[n+18]=dx; TVF[n+19]=dy; TVF[n+20]=dz; TVF[n+21]=u0; TVF[n+22]=v1; TVF[n+23]=shade;
    tvN += 24;
    TIX[tiN]   = tVerts;     TIX[tiN+1] = tVerts + 1; TIX[tiN+2] = tVerts + 2;
    TIX[tiN+3] = tVerts;     TIX[tiN+4] = tVerts + 2; TIX[tiN+5] = tVerts + 3;
    tiN += 6;
    tVerts += 4;
  }

  // zA < zB always
  function topQuad(x0, x1, zA, zB, y, uv, shade) {
    tQuad(x0,y,zB, x1,y,zB, x1,y,zA, x0,y,zA, uv, shade);
  }
  function wallX(x, y0, y1, zA, zB, facing, uv) {
    if (facing < 0) tQuad(x,y0,zA, x,y0,zB, x,y1,zB, x,y1,zA, uv, SH_X);
    else            tQuad(x,y0,zB, x,y0,zA, x,y1,zA, x,y1,zB, uv, SH_X);
  }
  function wallZ(z, y0, y1, x0, x1, facing, uv) {
    if (facing > 0) tQuad(x0,y0,z, x1,y0,z, x1,y1,z, x0,y1,z, uv, SH_Z);
    else            tQuad(x1,y0,z, x0,y0,z, x0,y1,z, x1,y1,z, uv, SH_Z);
  }
  function tBox(x0, y0, z0, x1, y1, z1, uv) {
    tQuad(x0,y1,z1, x1,y1,z1, x1,y1,z0, x0,y1,z0, uv, SH_TOP);
    tQuad(x0,y0,z1, x1,y0,z1, x1,y1,z1, x0,y1,z1, uv, SH_Z);
    tQuad(x1,y0,z0, x0,y0,z0, x0,y1,z0, x1,y1,z0, uv, SH_Z);
    tQuad(x1,y0,z1, x1,y0,z0, x1,y1,z0, x1,y1,z1, uv, SH_X);
    tQuad(x0,y0,z0, x0,y0,z1, x0,y1,z1, x0,y1,z0, uv, SH_X);
  }

  var tVbo = gl.createBuffer();
  var tIbo = gl.createBuffer();
  var windowStart = 0;

  var prevH = null, prevXs = 0; // previous row's heights for z-walls
  var rowH = new Array(COLS);

  function topYOf(h) { return h < 0 ? WATER_Y : h; }

  function buildWindow(startRow) {
    windowStart = startRow;
    tvN = 0; tiN = 0; tVerts = 0;
    rocks.length = 0;
    prevH = null;

    for (var r = startRow; r < startRow + ROWS; r++) {
      var c = riverCenter(r + 0.5);
      var hw = halfWidth(r + 0.5);
      var xs = Math.floor(c) - ((COLS - 1) >> 1);
      var zA = -(r + 1), zB = -r;
      var i, x, d, h;

      for (i = 0; i < COLS; i++) {
        x = xs + i;
        d = Math.abs(x + 0.5 - c);
        if (d < hw) h = -1;          // water
        else if (d < 11) h = 1;      // low bank
        else h = 2;                  // valley wall
        rowH[i] = h;

        if (h < 0) {
          topQuad(x, x + 1, zA, zB, WATER_Y, UV_WATER, -SH_TOP);
        } else {
          var tint = ((x + r) % 2 === 0) ? 1.0 : 0.94;
          topQuad(x, x + 1, zA, zB, h, UV_GRASS_TOP, SH_TOP * tint);
        }
      }

      // Walls between columns (bank faces looking over the water)
      for (i = 0; i < COLS - 1; i++) {
        var hA = topYOf(rowH[i]), hB = topYOf(rowH[i + 1]);
        if (hA !== hB) {
          var xb = xs + i + 1;
          if (hA < hB) wallX(xb, hA, hB, zA, zB, -1, UV_GRASS_SIDE);
          else         wallX(xb, hB, hA, zA, zB,  1, UV_GRASS_SIDE);
        }
      }

      // Walls between this row and the previous one (river curving)
      if (prevH) {
        var lo = Math.max(xs, prevXs);
        var hi = Math.min(xs + COLS, prevXs + COLS);
        for (x = lo; x < hi; x++) {
          var hc = topYOf(rowH[x - xs]);
          var hp = topYOf(prevH[x - prevXs]);
          if (hc !== hp) {
            // prev row sits at larger z (behind, toward the camera)
            if (hp < hc) wallZ(zB, hp, hc, x, x + 1,  1, UV_GRASS_SIDE);
            else         wallZ(zB, hc, hp, x, x + 1, -1, UV_GRASS_SIDE);
          }
        }
      }
      prevH = rowH.slice(0);
      prevXs = xs;

      // Rocks: deterministic per row, always inside the channel
      if (r > 24 && hash(r * 7.13) < 0.11 && hw > 2.6) {
        var rx = c + (hash(r * 3.71) - 0.5) * 2 * (hw - 1.4);
        tBox(rx - 0.35, WATER_Y - 0.2, zA + 0.15,
             rx + 0.35, WATER_Y + 0.55, zB - 0.15, UV_STONE);
        rocks.push({ x: rx, r: r, hit: false });
      }
    }

    gl.bindBuffer(gl.ARRAY_BUFFER, tVbo);
    gl.bufferData(gl.ARRAY_BUFFER, TVF.subarray(0, tvN), gl.DYNAMIC_DRAW);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, tIbo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, TIX.subarray(0, tiN), gl.DYNAMIC_DRAW);
    terrainIndexCount = tiN;
  }

  // ---------------------------------------------------------------
  // Boat mesh (static buffers; local forward = -Z)
  // ---------------------------------------------------------------
  var bVerts = [], bIdx = [], bCount = 0;
  function bQuad(p0, p1, p2, p3, uv, shade) {
    var us = [uv[0], uv[1],  uv[2], uv[1],  uv[2], uv[3],  uv[0], uv[3]];
    var ps = [p0, p1, p2, p3];
    for (var k = 0; k < 4; k++) {
      bVerts.push(ps[k][0], ps[k][1], ps[k][2], us[k * 2], us[k * 2 + 1], shade);
    }
    bIdx.push(bCount, bCount + 1, bCount + 2, bCount, bCount + 2, bCount + 3);
    bCount += 4;
  }
  function bBox(x0, y0, z0, x1, y1, z1, uv) {
    bQuad([x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0], uv, SH_TOP);
    bQuad([x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1], uv, SH_BOT);
    bQuad([x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1], uv, SH_Z);
    bQuad([x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0], uv, SH_Z);
    bQuad([x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1], uv, SH_X);
    bQuad([x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0], uv, SH_X);
  }

  bBox(-0.45, 0.00, -1.10, 0.45, 0.35, 0.90, UV_WOOD);  // hull
  bBox(-0.28, 0.05, -1.50, 0.28, 0.32, -1.10, UV_WOOD); // bow
  bBox(-0.36, 0.35, -0.75, 0.36, 0.58, -0.58, UV_DARK); // windshield
  bBox(-0.24, 0.35,  0.00, 0.24, 0.52, 0.34, UV_RED);   // seat
  bBox(-0.12, 0.25,  0.90, 0.12, 0.62, 1.14, UV_DARK);  // outboard

  var bVbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, bVbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(bVerts), gl.STATIC_DRAW);
  var bIbo = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, bIbo);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(bIdx), gl.STATIC_DRAW);
  var boatIndexCount = bIdx.length;

  var STRIDE = 6 * 4;
  function bindBuffers(vb, ib) {
    gl.bindBuffer(gl.ARRAY_BUFFER, vb);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
    gl.vertexAttribPointer(loc.aPos, 3, gl.FLOAT, false, STRIDE, 0);
    gl.vertexAttribPointer(loc.aUV, 2, gl.FLOAT, false, STRIDE, 12);
    gl.vertexAttribPointer(loc.aShade, 1, gl.FLOAT, false, STRIDE, 20);
  }
  gl.enableVertexAttribArray(loc.aPos);
  gl.enableVertexAttribArray(loc.aUV);
  gl.enableVertexAttribArray(loc.aShade);

  // ---------------------------------------------------------------
  // mat4
  // ---------------------------------------------------------------
  function mat4() { var m = new Float32Array(16); m[0]=m[5]=m[10]=m[15]=1; return m; }
  var mulTmp = new Float32Array(16);
  function mul(out, a, b) {
    var r, c, i, s;
    for (c = 0; c < 4; c++) for (r = 0; r < 4; r++) {
      s = 0;
      for (i = 0; i < 4; i++) s += a[i * 4 + r] * b[c * 4 + i];
      mulTmp[c * 4 + r] = s;
    }
    for (i = 0; i < 16; i++) out[i] = mulTmp[i];
  }
  function setTRY(out, tx, ty, tz, yaw) {
    var cy = Math.cos(yaw), sy = Math.sin(yaw);
    out[0]=cy;  out[1]=0; out[2]=-sy; out[3]=0;
    out[4]=0;   out[5]=1; out[6]=0;   out[7]=0;
    out[8]=sy;  out[9]=0; out[10]=cy; out[11]=0;
    out[12]=tx; out[13]=ty; out[14]=tz; out[15]=1;
  }
  function setRX(out, ang) {
    var c = Math.cos(ang), s = Math.sin(ang);
    out[0]=1; out[1]=0;  out[2]=0;  out[3]=0;
    out[4]=0; out[5]=c;  out[6]=s;  out[7]=0;
    out[8]=0; out[9]=-s; out[10]=c; out[11]=0;
    out[12]=0; out[13]=0; out[14]=0; out[15]=1;
  }
  function setRZ(out, ang) {
    var c = Math.cos(ang), s = Math.sin(ang);
    out[0]=c;  out[1]=s; out[2]=0; out[3]=0;
    out[4]=-s; out[5]=c; out[6]=0; out[7]=0;
    out[8]=0;  out[9]=0; out[10]=1; out[11]=0;
    out[12]=0; out[13]=0; out[14]=0; out[15]=1;
  }
  function perspective(out, fovy, aspect, near, far) {
    var f = 1 / Math.tan(fovy / 2);
    var nf = 1 / (near - far);
    out[0]=f/aspect; out[1]=0; out[2]=0;              out[3]=0;
    out[4]=0;        out[5]=f; out[6]=0;              out[7]=0;
    out[8]=0;        out[9]=0; out[10]=(far+near)*nf; out[11]=-1;
    out[12]=0;       out[13]=0;out[14]=2*far*near*nf; out[15]=0;
  }
  function viewMatrix(out, ex, ey, ez, yaw, pitch) {
    var cy = Math.cos(yaw),  sy = Math.sin(yaw);
    var cp = Math.cos(pitch), sp = Math.sin(pitch);
    var rx = [cy, sy * sp, sy * cp];
    var ry = [0,  cp,     -sp];
    var rz = [-sy, cy * sp, cy * cp];
    out[0]=rx[0]; out[1]=rx[1]; out[2]=rx[2];  out[3]=0;
    out[4]=ry[0]; out[5]=ry[1]; out[6]=ry[2];  out[7]=0;
    out[8]=rz[0]; out[9]=rz[1]; out[10]=rz[2]; out[11]=0;
    out[12]=-(rx[0]*ex + ry[0]*ey + rz[0]*ez);
    out[13]=-(rx[1]*ex + ry[1]*ey + rz[1]*ez);
    out[14]=-(rx[2]*ex + ry[2]*ey + rz[2]*ez);
    out[15]=1;
  }

  var proj = mat4();
  var view = mat4();
  var identity = mat4();
  var boatMat = mat4();
  var tmpA = mat4();
  var tmpB = mat4();

  // ---------------------------------------------------------------
  // Boat state
  // ---------------------------------------------------------------
  var boat = {
    dist: 0,               // how far downriver (world z = -dist)
    x: riverCenter(0),
    v: 5, vx: 0,
    bobT: 0
  };
  var BASE_SPEED = 6, SPEED_SPAN = 4;  // throttle range 2..10
  var STEER_V = 5.5;

  // ---------------------------------------------------------------
  // Keyboard (BB10 multi-path). A/D + J/L steer, W/S + I/K throttle.
  // ---------------------------------------------------------------
  var keyHeld = {};
  var keyExpiry = {};
  var PRESS_HOLD_MS = 300;

  function mapCode(code) {
    switch (code) {
      case 65: case 97:  case 74: case 106: case 37: return "steerL"; // A J Left
      case 68: case 100: case 76: case 108: case 39: return "steerR"; // D L Right
      case 87: case 119: case 73: case 105: case 38: return "thrUp";  // W I Up
      case 83: case 115: case 75: case 107: case 40: return "thrDn";  // S K Down
    }
    return null;
  }
  function mapKeyEvent(e) {
    var name = null;
    if (e.key) {
      switch (e.key) {
        case "a": case "A": case "j": case "J":
        case "ArrowLeft": case "Left": name = "steerL"; break;
        case "d": case "D": case "l": case "L":
        case "ArrowRight": case "Right": name = "steerR"; break;
        case "w": case "W": case "i": case "I":
        case "ArrowUp": case "Up": name = "thrUp"; break;
        case "s": case "S": case "k": case "K":
        case "ArrowDown": case "Down": name = "thrDn"; break;
      }
    }
    if (!name && e.keyIdentifier) {
      var ki = e.keyIdentifier;
      if (ki.indexOf("U+") === 0) name = mapCode(parseInt(ki.slice(2), 16));
      else if (ki === "Left")  name = "steerL";
      else if (ki === "Right") name = "steerR";
      else if (ki === "Up")    name = "thrUp";
      else if (ki === "Down")  name = "thrDn";
    }
    if (!name && e.keyCode) name = mapCode(e.keyCode);
    return name;
  }

  document.addEventListener("keydown", function (e) {
    var name = mapKeyEvent(e);
    if (name) {
      keyHeld[name] = true;
      keyExpiry[name] = now() + PRESS_HOLD_MS;
      if (e.preventDefault) e.preventDefault();
    }
  }, false);
  document.addEventListener("keyup", function (e) {
    var name = mapKeyEvent(e);
    if (name) {
      keyHeld[name] = false;
      keyExpiry[name] = 0;
    }
  }, false);
  document.addEventListener("keypress", function (e) {
    var name = mapCode(e.charCode || e.keyCode || 0);
    if (name) {
      keyExpiry[name] = now() + PRESS_HOLD_MS;
      if (e.preventDefault) e.preventDefault();
    }
  }, false);
  window.addEventListener("blur", function () {
    keyHeld = {};
    keyExpiry = {};
  }, false);
  function isDown(name) {
    if (keyHeld[name]) return true;
    var exp = keyExpiry[name];
    return !!exp && exp > now();
  }

  // ---------------------------------------------------------------
  // Touch/mouse: one stick anywhere. dx steers, dy adjusts throttle.
  // ---------------------------------------------------------------
  var stick = null;
  var STICK_RANGE = 60;

  function findTouch(list, id) {
    for (var i = 0; i < list.length; i++) {
      if (list[i].identifier === id) return list[i];
    }
    return null;
  }
  canvas.addEventListener("touchstart", function (e) {
    e.preventDefault();
    if (!stick) {
      var t = e.changedTouches[0];
      stick = { id: t.identifier, sx: t.clientX, sy: t.clientY, dx: 0, dy: 0 };
    }
  }, false);
  canvas.addEventListener("touchmove", function (e) {
    e.preventDefault();
    if (stick) {
      var t = findTouch(e.touches, stick.id);
      if (t) {
        stick.dx = t.clientX - stick.sx;
        stick.dy = t.clientY - stick.sy;
      }
    }
  }, false);
  function endTouches(e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      if (stick && stick.id === e.changedTouches[i].identifier) stick = null;
    }
  }
  canvas.addEventListener("touchend", endTouches, false);
  canvas.addEventListener("touchcancel", endTouches, false);

  var mouseOn = false;
  canvas.addEventListener("mousedown", function (e) {
    if (e.preventDefault) e.preventDefault();
    if (!stick) {
      stick = { id: "mouse", sx: e.clientX, sy: e.clientY, dx: 0, dy: 0 };
      mouseOn = true;
    }
  }, false);
  document.addEventListener("mouseup", function () {
    if (mouseOn && stick && stick.id === "mouse") stick = null;
    mouseOn = false;
  }, false);
  document.addEventListener("mousemove", function (e) {
    if (mouseOn && stick && stick.id === "mouse") {
      stick.dx = e.clientX - stick.sx;
      stick.dy = e.clientY - stick.sy;
    }
  }, false);
  canvas.addEventListener("contextmenu", function (e) {
    if (e.preventDefault) e.preventDefault();
  }, false);

  function clampf(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  // ---------------------------------------------------------------
  // Boat update
  // ---------------------------------------------------------------
  var scrape = 0; // >0 briefly while grinding a bank

  function updateBoat(dt) {
    var steer = 0, thr = 0;
    if (isDown("steerL")) steer -= 1;
    if (isDown("steerR")) steer += 1;
    if (isDown("thrUp"))  thr += 1;
    if (isDown("thrDn"))  thr -= 1;
    if (stick) {
      steer += clampf(stick.dx / STICK_RANGE, -1, 1);
      thr   += clampf(-stick.dy / STICK_RANGE, -1, 1);
    }
    steer = clampf(steer, -1, 1);
    thr   = clampf(thr, -1, 1);

    var targetV = BASE_SPEED + thr * SPEED_SPAN;
    boat.v += (targetV - boat.v) * Math.min(1, 2 * dt);

    var targetVx = steer * STEER_V;
    boat.vx += (targetVx - boat.vx) * Math.min(1, 8 * dt);

    boat.dist += boat.v * dt;
    boat.x += boat.vx * dt;

    // Banks: clamp into the channel; grinding costs speed.
    var c = riverCenter(boat.dist);
    var hw = halfWidth(boat.dist);
    var lo = c - hw + 0.55, hi = c + hw - 0.55;
    if (boat.x < lo) {
      boat.x = lo;
      if (boat.vx < 0) boat.vx = 0;
      boat.v *= Math.max(0, 1 - 2.5 * dt);
      scrape = 0.2;
    } else if (boat.x > hi) {
      boat.x = hi;
      if (boat.vx > 0) boat.vx = 0;
      boat.v *= Math.max(0, 1 - 2.5 * dt);
      scrape = 0.2;
    }
    if (scrape > 0) scrape -= dt;

    // Rocks: a hit kills most of your speed and knocks you sideways.
    var bz = -boat.dist;
    for (var i = 0; i < rocks.length; i++) {
      var rk = rocks[i];
      if (rk.hit) continue;
      var rz = -(rk.r + 0.5);
      if (Math.abs(bz - rz) < 0.9 && Math.abs(boat.x - rk.x) < 0.8) {
        rk.hit = true;
        boat.v *= 0.35;
        boat.vx += (boat.x < rk.x ? -3.5 : 3.5);
      }
    }

    boat.bobT += dt * (2.5 + boat.v * 0.25);

    // Slide the terrain window forward as we travel.
    var rb = Math.floor(boat.dist);
    if (rb > windowStart + 12) {
      buildWindow(rb - 6);
    }
  }

  // ---------------------------------------------------------------
  // Main loop
  // ---------------------------------------------------------------
  var SKY = [0.55, 0.75, 0.95];
  gl.clearColor(SKY[0], SKY[1], SKY[2], 1);
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);

  gl.uniform1i(loc.uTex, 0);
  gl.uniform3f(loc.uSky, SKY[0], SKY[1], SKY[2]);
  gl.uniform1f(loc.uFogStart, 26.0);
  gl.uniform1f(loc.uFogEnd, 52.0);

  var statEl = document.getElementById("stat");
  var frames = 0, fpsTime = 0, lastFps = 0, statTime = 0;
  var last = now();
  var startT = last;
  var camX = boat.x;

  buildWindow(0);

  function frame() {
    var t = now();
    var dt = (t - last) / 1000;
    last = t;
    if (dt > 0.1) dt = 0.1;

    resize();
    updateBoat(dt);

    gl.uniform1f(loc.uTime, (t - startT) / 1000);

    // Camera: behind and above, tracking the boat's x with a lag so
    // the river's sweep reads on screen.
    camX += (boat.x - camX) * Math.min(1, 4 * dt);
    var ex = camX;
    var ey = WATER_Y + 3.4;
    var ez = -boat.dist + 7.5;
    var CAM_PITCH = -0.30;

    perspective(proj, 70 * Math.PI / 180, canvas.width / canvas.height, 0.1, 130);
    viewMatrix(view, ex, ey, ez, 0, CAM_PITCH);

    gl.uniformMatrix4fv(loc.uProj, false, proj);
    gl.uniformMatrix4fv(loc.uView, false, view);

    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    // Terrain
    bindBuffers(tVbo, tIbo);
    gl.uniformMatrix4fv(loc.uModel, false, identity);
    gl.drawElements(gl.TRIANGLES, terrainIndexCount, gl.UNSIGNED_SHORT, 0);

    // Boat: bobs on the water, noses up with speed, leans into turns.
    var by = WATER_Y + 0.05 + Math.sin(boat.bobT * 3.7) * 0.04;
    var yawVis   = clampf(-boat.vx * 0.08, -0.5, 0.5);
    var pitchVis = 0.018 * boat.v + Math.sin(boat.bobT * 2.3) * 0.02;
    var rollVis  = clampf(-boat.vx * 0.05, -0.3, 0.3) +
                   (scrape > 0 ? Math.sin(boat.bobT * 30) * 0.03 : 0);

    setTRY(boatMat, boat.x, by, -boat.dist, yawVis);
    setRX(tmpA, pitchVis);
    mul(tmpB, boatMat, tmpA);
    setRZ(tmpA, rollVis);
    mul(boatMat, tmpB, tmpA);

    bindBuffers(bVbo, bIbo);
    gl.uniformMatrix4fv(loc.uModel, false, boatMat);
    gl.drawElements(gl.TRIANGLES, boatIndexCount, gl.UNSIGNED_SHORT, 0);

    // HUD
    frames++;
    fpsTime += dt;
    statTime += dt;
    if (fpsTime >= 1) { lastFps = frames; frames = 0; fpsTime = 0; }
    if (statTime >= 0.25) {
      statTime = 0;
      statEl.innerHTML = lastFps + " fps &#183; " +
        Math.floor(boat.dist) + " m &#183; spd " + boat.v.toFixed(1);
    }

    raf(frame);
  }

  resize();
  raf(frame);
})();
</script>
</body>
</html>
