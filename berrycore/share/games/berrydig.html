<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BerryDig</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
  #gl { display:block; width:100%; height:100%; touch-action:none; }
  #hud {
    position:absolute; top:0; left:0; right:0;
    font-family:monospace; color:#fff; pointer-events:none;
    text-shadow:1px 1px 0 rgba(0,0,0,0.6);
  }
  #hud .title { position:absolute; top:6px; left:8px; font-size:11px; opacity:0.85; }
  #hud .stat  { position:absolute; top:6px; right:8px; font-size:12px; opacity:0.85; }
  #dig {
    position:absolute; right:14px; bottom:14px; width:72px; height:72px;
    border-radius:50%; background:rgba(230,180,40,0.25);
    border:2px solid rgba(255,220,80,0.7); color:#fff;
    font-family:monospace; font-size:13px; line-height:68px; text-align:center;
    -webkit-user-select:none; user-select:none;
  }
  #err {
    position:absolute; left:0; right:0; top:40%; text-align:center;
    color:#f66; font-family:monospace; font-size:14px; display:none; padding:0 20px;
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <div class="title">BerryDig &#183; WASD drive &#183; J/L swing &#183; I/K boom &#183; U/O stick &#183; F/DIG = dig &amp; dump</div>
  <div class="stat" id="stat"></div>
</div>
<div id="dig">DIG</div>
<div id="err">WebGL not available on this device/browser.</div>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------
  // Compat shims (BB10 WebKit)
  // ---------------------------------------------------------------
  var raf = window.requestAnimationFrame ||
            window.webkitRequestAnimationFrame ||
            function (cb) { return setTimeout(function () { cb(now()); }, 16); };

  function now() {
    return (window.performance && window.performance.now)
      ? window.performance.now()
      : Date.now();
  }

  // ---------------------------------------------------------------
  // Canvas + GL
  // ---------------------------------------------------------------
  var canvas = document.getElementById("gl");
  var gl = null;
  var ctxNames = ["webgl", "experimental-webgl"];
  for (var ci = 0; ci < ctxNames.length && !gl; ci++) {
    try { gl = canvas.getContext(ctxNames[ci], { antialias: false }); } catch (e) {}
  }
  if (!gl) {
    document.getElementById("err").style.display = "block";
    return;
  }

  var MAX_DIM = 720;
  function resize() {
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.clientWidth  * dpr;
    var h = canvas.clientHeight * dpr;
    var scale = Math.min(1, MAX_DIM / Math.max(w, h));
    var bw = Math.max(1, Math.floor(w * scale));
    var bh = Math.max(1, Math.floor(h * scale));
    if (canvas.width !== bw || canvas.height !== bh) {
      canvas.width = bw;
      canvas.height = bh;
    }
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener("resize", resize, false);
  window.addEventListener("orientationchange", resize, false);

  // ---------------------------------------------------------------
  // Shaders
  // ---------------------------------------------------------------
  var VSH =
    "attribute vec3 aPos;\n" +
    "attribute vec2 aUV;\n" +
    "attribute float aShade;\n" +
    "uniform mat4 uProj;\n" +
    "uniform mat4 uView;\n" +
    "uniform mat4 uModel;\n" +
    "varying vec2 vUV;\n" +
    "varying float vShade;\n" +
    "varying float vDist;\n" +
    "void main() {\n" +
    "  vec4 eye = uView * uModel * vec4(aPos, 1.0);\n" +
    "  vDist = length(eye.xyz);\n" +
    "  vUV = aUV;\n" +
    "  vShade = aShade;\n" +
    "  gl_Position = uProj * eye;\n" +
    "}\n";

  var FSH =
    "precision mediump float;\n" +
    "uniform sampler2D uTex;\n" +
    "uniform vec3 uSky;\n" +
    "uniform float uFogStart;\n" +
    "uniform float uFogEnd;\n" +
    "varying vec2 vUV;\n" +
    "varying float vShade;\n" +
    "varying float vDist;\n" +
    "void main() {\n" +
    "  vec4 tex = texture2D(uTex, vUV);\n" +
    "  vec3 col = tex.rgb * vShade;\n" +
    "  float f = clamp((vDist - uFogStart) / (uFogEnd - uFogStart), 0.0, 1.0);\n" +
    "  gl_FragColor = vec4(mix(col, uSky, f), 1.0);\n" +
    "}\n";

  function makeShader(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(s) || "shader compile failed");
    }
    return s;
  }

  var prog = gl.createProgram();
  gl.attachShader(prog, makeShader(gl.VERTEX_SHADER, VSH));
  gl.attachShader(prog, makeShader(gl.FRAGMENT_SHADER, FSH));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(prog) || "link failed");
  }
  gl.useProgram(prog);

  var loc = {
    aPos:   gl.getAttribLocation(prog, "aPos"),
    aUV:    gl.getAttribLocation(prog, "aUV"),
    aShade: gl.getAttribLocation(prog, "aShade"),
    uProj:  gl.getUniformLocation(prog, "uProj"),
    uView:  gl.getUniformLocation(prog, "uView"),
    uModel: gl.getUniformLocation(prog, "uModel"),
    uTex:   gl.getUniformLocation(prog, "uTex"),
    uSky:   gl.getUniformLocation(prog, "uSky"),
    uFogStart: gl.getUniformLocation(prog, "uFogStart"),
    uFogEnd:   gl.getUniformLocation(prog, "uFogEnd")
  };

  // ---------------------------------------------------------------
  // Atlas: terrain row 0, machine row 2
  // ---------------------------------------------------------------
  var TILE = 16;
  var ATLAS = 64;

  function rnd(seed) {
    var s = seed;
    return function () {
      s = (s * 1103515245 + 12345) & 0x7fffffff;
      return s / 0x7fffffff;
    };
  }
  function noiseTile(x, col, row, r, cr, cg, cb, lo, hi) {
    var i, j, v;
    for (j = 0; j < TILE; j++) for (i = 0; i < TILE; i++) {
      v = lo + r() * (hi - lo);
      x.fillStyle = "rgb(" + Math.floor(cr * v) + "," + Math.floor(cg * v) + "," + Math.floor(cb * v) + ")";
      x.fillRect(col * TILE + i, row * TILE + j, 1, 1);
    }
  }
  function buildAtlas() {
    var c = document.createElement("canvas");
    c.width = ATLAS; c.height = ATLAS;
    var x = c.getContext("2d");
    var r = rnd(1337);
    noiseTile(x, 0, 0, r, 70, 160, 60, 0.75, 1.0);   // grass
    noiseTile(x, 1, 0, r, 134, 96, 67, 0.7, 1.0);    // dirt
    noiseTile(x, 2, 0, r, 110, 78, 52, 0.7, 1.0);    // deep dirt (walls)
    noiseTile(x, 3, 0, r, 128, 128, 128, 0.75, 1.0); // stone
    noiseTile(x, 0, 2, r, 235, 170, 30, 0.88, 1.0);  // excavator yellow
    noiseTile(x, 1, 2, r, 40, 42, 46, 0.9, 1.0);     // dark steel / tracks
    noiseTile(x, 2, 2, r, 90, 140, 180, 0.9, 1.0);   // cab glass
    noiseTile(x, 3, 2, r, 120, 86, 58, 0.75, 1.0);   // dirt load in bucket
    return c;
  }

  var tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, buildAtlas());
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  function tileUV(col, row) {
    var u0 = (col * TILE + 0.5) / ATLAS;
    var u1 = ((col + 1) * TILE - 0.5) / ATLAS;
    var v0 = (row * TILE + 0.5) / ATLAS;
    var v1 = ((row + 1) * TILE - 0.5) / ATLAS;
    return [u0, v0, u1, v1];
  }
  var UV_GRASS = tileUV(0, 0);
  var UV_DIRT  = tileUV(1, 0);
  var UV_WALL  = tileUV(2, 0);
  var UV_YEL   = tileUV(0, 2);
  var UV_DARK  = tileUV(1, 2);
  var UV_GLASS = tileUV(2, 2);
  var UV_LOAD  = tileUV(3, 2);

  var SH_TOP = 1.0, SH_X = 0.8, SH_Z = 0.65, SH_BOT = 0.5;

  // ---------------------------------------------------------------
  // Deformable heightfield: W x D cells, each with a float height.
  // Grass starts at 1.0; digging lowers cells (exposing dirt),
  // dumping raises them (dirt piles). Remeshed on change, throttled.
  // ---------------------------------------------------------------
  var W = 48, D = 48;
  var H = new Float32Array(W * D);
  for (var hi0 = 0; hi0 < W * D; hi0++) H[hi0] = 1.0;
  var MINH = -1.2, MAXH = 4.0;

  function hAt(cx, cz) {
    if (cx < 0) cx = 0; if (cx > W - 1) cx = W - 1;
    if (cz < 0) cz = 0; if (cz > D - 1) cz = D - 1;
    return H[cz * W + cx];
  }
  function hash(n) {
    var s = Math.sin(n * 127.1) * 43758.5453;
    return s - Math.floor(s);
  }

  var TVF = new Float32Array(200000);
  var TIX = new Uint16Array(54000);
  var tvN = 0, tiN = 0, tVerts = 0;
  var terrainIndexCount = 0;

  function tQuad(ax,ay,az, bx,by,bz, cx,cy,cz, dx,dy,dz, uv, shade) {
    var u0 = uv[0], v0 = uv[1], u1 = uv[2], v1 = uv[3];
    var n = tvN;
    TVF[n]=ax; TVF[n+1]=ay; TVF[n+2]=az; TVF[n+3]=u0; TVF[n+4]=v0; TVF[n+5]=shade;
    TVF[n+6]=bx; TVF[n+7]=by; TVF[n+8]=bz; TVF[n+9]=u1; TVF[n+10]=v0; TVF[n+11]=shade;
    TVF[n+12]=cx; TVF[n+13]=cy; TVF[n+14]=cz; TVF[n+15]=u1; TVF[n+16]=v1; TVF[n+17]=shade;
    TVF[n+18]=dx; TVF[n+19]=dy; TVF[n+20]=dz; TVF[n+21]=u0; TVF[n+22]=v1; TVF[n+23]=shade;
    tvN += 24;
    TIX[tiN]   = tVerts;     TIX[tiN+1] = tVerts + 1; TIX[tiN+2] = tVerts + 2;
    TIX[tiN+3] = tVerts;     TIX[tiN+4] = tVerts + 2; TIX[tiN+5] = tVerts + 3;
    tiN += 6;
    tVerts += 4;
  }

  var tVbo = gl.createBuffer();
  var tIbo = gl.createBuffer();
  var terrainDirty = true;
  var remeshCooldown = 0;

  function remesh() {
    tvN = 0; tiN = 0; tVerts = 0;
    var x, z, h, hn, lo, hiY;

    for (z = 0; z < D; z++) {
      for (x = 0; x < W; x++) {
        h = H[z * W + x];
        var disturbed = Math.abs(h - 1.0) > 0.01;
        var uv = disturbed ? UV_DIRT : UV_GRASS;
        var tint = 0.92 + hash(x * 3.1 + z * 7.7) * 0.1;
        // top (z+1 is the larger-z edge)
        tQuad(x, h, z + 1,  x + 1, h, z + 1,  x + 1, h, z,  x, h, z,
              uv, SH_TOP * tint);

        // wall to +X neighbor
        if (x < W - 1) {
          hn = H[z * W + x + 1];
          if (Math.abs(h - hn) > 0.03) {
            lo = Math.min(h, hn); hiY = Math.max(h, hn);
            if (h < hn) // face -X (toward this lower cell)
              tQuad(x+1,lo,z, x+1,lo,z+1, x+1,hiY,z+1, x+1,hiY,z, UV_WALL, SH_X);
            else        // face +X
              tQuad(x+1,lo,z+1, x+1,lo,z, x+1,hiY,z, x+1,hiY,z+1, UV_WALL, SH_X);
          }
        }
        // wall to +Z neighbor
        if (z < D - 1) {
          hn = H[(z + 1) * W + x];
          if (Math.abs(h - hn) > 0.03) {
            lo = Math.min(h, hn); hiY = Math.max(h, hn);
            if (h < hn) // face -Z
              tQuad(x+1,lo,z+1, x,lo,z+1, x,hiY,z+1, x+1,hiY,z+1, UV_WALL, SH_Z);
            else        // face +Z
              tQuad(x,lo,z+1, x+1,lo,z+1, x+1,hiY,z+1, x,hiY,z+1, UV_WALL, SH_Z);
          }
        }
      }
    }
    // boundary skirt down to y = MINH - 0.5
    var base = MINH - 0.5;
    for (x = 0; x < W; x++) {
      h = H[(D - 1) * W + x];
      tQuad(x,base,D, x+1,base,D, x+1,h,D, x,h,D, UV_WALL, SH_Z);
      h = H[x];
      tQuad(x+1,base,0, x,base,0, x,h,0, x+1,h,0, UV_WALL, SH_Z);
    }
    for (z = 0; z < D; z++) {
      h = H[z * W + W - 1];
      tQuad(W,base,z+1, W,base,z, W,h,z, W,h,z+1, UV_WALL, SH_X);
      h = H[z * W];
      tQuad(0,base,z, 0,base,z+1, 0,h,z+1, 0,h,z, UV_WALL, SH_X);
    }

    gl.bindBuffer(gl.ARRAY_BUFFER, tVbo);
    gl.bufferData(gl.ARRAY_BUFFER, TVF.subarray(0, tvN), gl.DYNAMIC_DRAW);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, tIbo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, TIX.subarray(0, tiN), gl.DYNAMIC_DRAW);
    terrainIndexCount = tiN;
    terrainDirty = false;
  }

  // ---------------------------------------------------------------
  // Excavator mesh: one static buffer, part ranges drawn with a
  // chained matrix per part (base -> cab -> boom -> stick -> bucket).
  // Local forward is -Z for every link.
  // ---------------------------------------------------------------
  var mVerts = [], mIdx = [], mCount = 0;
  function mQuad(p0, p1, p2, p3, uv, shade) {
    var us = [uv[0], uv[1],  uv[2], uv[1],  uv[2], uv[3],  uv[0], uv[3]];
    var ps = [p0, p1, p2, p3];
    for (var k = 0; k < 4; k++) {
      mVerts.push(ps[k][0], ps[k][1], ps[k][2], us[k * 2], us[k * 2 + 1], shade);
    }
    mIdx.push(mCount, mCount + 1, mCount + 2, mCount, mCount + 2, mCount + 3);
    mCount += 4;
  }
  function mBox(x0, y0, z0, x1, y1, z1, uv) {
    mQuad([x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0], uv, SH_TOP);
    mQuad([x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1], uv, SH_BOT);
    mQuad([x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1], uv, SH_Z);
    mQuad([x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0], uv, SH_Z);
    mQuad([x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1], uv, SH_X);
    mQuad([x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0], uv, SH_X);
  }
  function part() {
    var p = { start: mIdx.length, count: 0 };
    return p;
  }
  function endPart(p) { p.count = mIdx.length - p.start; }

  // Base: tracks + deck
  var P_BASE = part();
  mBox(-0.62, 0.00, -0.85, -0.34, 0.34, 0.85, UV_DARK); // left track
  mBox( 0.34, 0.00, -0.85,  0.62, 0.34, 0.85, UV_DARK); // right track
  mBox(-0.45, 0.34, -0.60,  0.45, 0.50, 0.60, UV_DARK); // deck
  endPart(P_BASE);

  // Cab house (rotates on the deck)
  var P_CAB = part();
  mBox(-0.55, 0.00, -0.55, 0.55, 0.62, 0.75, UV_YEL);   // house
  mBox(-0.50, 0.10, 0.75, 0.50, 0.55, 1.05, UV_DARK);   // counterweight
  mBox(-0.52, 0.20, -0.75, -0.12, 0.72, -0.30, UV_GLASS); // operator cab
  endPart(P_CAB);

  // Boom (pivots at the cab front)
  var P_BOOM = part();
  mBox(-0.13, -0.15, -2.60, 0.13, 0.17, 0.10, UV_YEL);
  endPart(P_BOOM);

  // Stick
  var P_STICK = part();
  mBox(-0.10, -0.12, -1.80, 0.10, 0.12, 0.10, UV_YEL);
  endPart(P_STICK);

  // Bucket: crude L-scoop
  var P_BUCKET = part();
  mBox(-0.30, -0.50, -0.12, 0.30, 0.02, 0.10, UV_DARK); // back plate
  mBox(-0.30, -0.52, -0.55, 0.30, -0.30, -0.10, UV_DARK); // floor
  endPart(P_BUCKET);

  // Dirt load shown in the bucket while carrying
  var P_LOAD = part();
  mBox(-0.24, -0.34, -0.50, 0.24, -0.08, -0.14, UV_LOAD);
  endPart(P_LOAD);

  var mVbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, mVbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(mVerts), gl.STATIC_DRAW);
  var mIbo = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mIbo);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(mIdx), gl.STATIC_DRAW);

  var STRIDE = 6 * 4;
  function bindBuffers(vb, ib) {
    gl.bindBuffer(gl.ARRAY_BUFFER, vb);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
    gl.vertexAttribPointer(loc.aPos, 3, gl.FLOAT, false, STRIDE, 0);
    gl.vertexAttribPointer(loc.aUV, 2, gl.FLOAT, false, STRIDE, 12);
    gl.vertexAttribPointer(loc.aShade, 1, gl.FLOAT, false, STRIDE, 20);
  }
  gl.enableVertexAttribArray(loc.aPos);
  gl.enableVertexAttribArray(loc.aUV);
  gl.enableVertexAttribArray(loc.aShade);

  // ---------------------------------------------------------------
  // mat4
  // ---------------------------------------------------------------
  function mat4() { var m = new Float32Array(16); m[0]=m[5]=m[10]=m[15]=1; return m; }
  var mulTmp = new Float32Array(16);
  function mul(out, a, b) {
    var r, c, i, s;
    for (c = 0; c < 4; c++) for (r = 0; r < 4; r++) {
      s = 0;
      for (i = 0; i < 4; i++) s += a[i * 4 + r] * b[c * 4 + i];
      mulTmp[c * 4 + r] = s;
    }
    for (i = 0; i < 16; i++) out[i] = mulTmp[i];
  }
  function setTRY(out, tx, ty, tz, yaw) {
    var cy = Math.cos(yaw), sy = Math.sin(yaw);
    out[0]=cy;  out[1]=0; out[2]=-sy; out[3]=0;
    out[4]=0;   out[5]=1; out[6]=0;   out[7]=0;
    out[8]=sy;  out[9]=0; out[10]=cy; out[11]=0;
    out[12]=tx; out[13]=ty; out[14]=tz; out[15]=1;
  }
  function setTRX(out, tx, ty, tz, ang) {
    var c = Math.cos(ang), s = Math.sin(ang);
    out[0]=1; out[1]=0;  out[2]=0;  out[3]=0;
    out[4]=0; out[5]=c;  out[6]=s;  out[7]=0;
    out[8]=0; out[9]=-s; out[10]=c; out[11]=0;
    out[12]=tx; out[13]=ty; out[14]=tz; out[15]=1;
  }
  function perspective(out, fovy, aspect, near, far) {
    var f = 1 / Math.tan(fovy / 2);
    var nf = 1 / (near - far);
    out[0]=f/aspect; out[1]=0; out[2]=0;              out[3]=0;
    out[4]=0;        out[5]=f; out[6]=0;              out[7]=0;
    out[8]=0;        out[9]=0; out[10]=(far+near)*nf; out[11]=-1;
    out[12]=0;       out[13]=0;out[14]=2*far*near*nf; out[15]=0;
  }
  function viewMatrix(out, ex, ey, ez, yaw, pitch) {
    var cy = Math.cos(yaw),  sy = Math.sin(yaw);
    var cp = Math.cos(pitch), sp = Math.sin(pitch);
    var rx = [cy, sy * sp, sy * cp];
    var ry = [0,  cp,     -sp];
    var rz = [-sy, cy * sp, cy * cp];
    out[0]=rx[0]; out[1]=rx[1]; out[2]=rx[2];  out[3]=0;
    out[4]=ry[0]; out[5]=ry[1]; out[6]=ry[2];  out[7]=0;
    out[8]=rz[0]; out[9]=rz[1]; out[10]=rz[2]; out[11]=0;
    out[12]=-(rx[0]*ex + ry[0]*ey + rz[0]*ez);
    out[13]=-(rx[1]*ex + ry[1]*ey + rz[1]*ez);
    out[14]=-(rx[2]*ex + ry[2]*ey + rz[2]*ez);
    out[15]=1;
  }

  var proj = mat4();
  var view = mat4();
  var identity = mat4();
  var baseMat = mat4();
  var cabMat = mat4();
  var boomMat = mat4();
  var stickMat = mat4();
  var bucketMat = mat4();
  var linkMat = mat4();

  // ---------------------------------------------------------------
  // Machine state
  // ---------------------------------------------------------------
  var exc = {
    x: W / 2, z: D / 2 + 6, y: 1.0,
    trackYaw: Math.PI,
    cabRel: 0,             // cab rotation relative to tracks
    boom: 0.55,            // elevation above horizontal (rad)
    stick: -1.3,           // relative to boom (rad, negative folds down)
    v: 0,
    bucket: 0              // dirt carried, in height units
  };
  var BUCKET_ANG = -1.15;  // fixed bucket curl relative to stick
  var CAP = 0.6;
  var DIG_RATE = 1.1;      // height units per second
  var DRIVE_MAX = 2.2;
  var TURN_RATE = 1.3;
  var SWING_RATE = 1.5;
  var BOOM_RATE = 0.85;
  var STICK_RATE = 1.2;
  var BOOM_MIN = -0.35, BOOM_MAX = 1.05;
  var STICK_MIN = -2.3, STICK_MAX = -0.3;

  // Forward kinematics to the bucket tip. Must stay in sync with the
  // link lengths/offsets used in the matrices below.
  var CAB_H = 0.50;        // cab base above ground (deck top)
  var PIV_H = 0.55;        // boom pivot above cab base
  var PIV_F = 0.55;        // boom pivot forward of cab center
  var BOOM_L = 2.6, STICK_L = 1.8;

  function bucketTip() {
    var e1 = exc.boom;
    var e2 = exc.boom + exc.stick;
    var reach = PIV_F + BOOM_L * Math.cos(e1) + STICK_L * Math.cos(e2) + 0.12;
    var lift  = CAB_H + PIV_H + BOOM_L * Math.sin(e1) + STICK_L * Math.sin(e2) - 0.45;
    var hd = exc.trackYaw + exc.cabRel;
    return {
      x: exc.x - Math.sin(hd) * reach,
      y: exc.y + lift,
      z: exc.z - Math.cos(hd) * reach
    };
  }

  // ---------------------------------------------------------------
  // Keyboard (BB10 multi-path)
  // ---------------------------------------------------------------
  var keyHeld = {};
  var keyExpiry = {};
  var PRESS_HOLD_MS = 300;

  function mapCode(code) {
    switch (code) {
      case 87: case 119: return "fwd";     // W
      case 83: case 115: return "back";    // S
      case 65: case 97:  return "turnL";   // A
      case 68: case 100: return "turnR";   // D
      case 74: case 106: case 37: return "swingL"; // J, Left
      case 76: case 108: case 39: return "swingR"; // L, Right
      case 73: case 105: case 38: return "boomUp"; // I, Up
      case 75: case 107: case 40: return "boomDn"; // K, Down
      case 85: case 117: return "stickOut"; // U
      case 79: case 111: return "stickIn";  // O
      case 70: case 102: case 32: return "dig"; // F, Space
    }
    return null;
  }
  function mapKeyEvent(e) {
    var name = null;
    if (e.key) {
      switch (e.key) {
        case "w": case "W": name = "fwd"; break;
        case "s": case "S": name = "back"; break;
        case "a": case "A": name = "turnL"; break;
        case "d": case "D": name = "turnR"; break;
        case "j": case "J": case "ArrowLeft": case "Left": name = "swingL"; break;
        case "l": case "L": case "ArrowRight": case "Right": name = "swingR"; break;
        case "i": case "I": case "ArrowUp": case "Up": name = "boomUp"; break;
        case "k": case "K": case "ArrowDown": case "Down": name = "boomDn"; break;
        case "u": case "U": name = "stickOut"; break;
        case "o": case "O": name = "stickIn"; break;
        case "f": case "F": case " ": case "Spacebar": name = "dig"; break;
      }
    }
    if (!name && e.keyIdentifier) {
      var ki = e.keyIdentifier;
      if (ki.indexOf("U+") === 0) name = mapCode(parseInt(ki.slice(2), 16));
      else if (ki === "Left")  name = "swingL";
      else if (ki === "Right") name = "swingR";
      else if (ki === "Up")    name = "boomUp";
      else if (ki === "Down")  name = "boomDn";
    }
    if (!name && e.keyCode) name = mapCode(e.keyCode);
    return name;
  }

  document.addEventListener("keydown", function (e) {
    var name = mapKeyEvent(e);
    if (name) {
      keyHeld[name] = true;
      keyExpiry[name] = now() + PRESS_HOLD_MS;
      if (e.preventDefault) e.preventDefault();
    }
  }, false);
  document.addEventListener("keyup", function (e) {
    var name = mapKeyEvent(e);
    if (name) {
      keyHeld[name] = false;
      keyExpiry[name] = 0;
    }
  }, false);
  document.addEventListener("keypress", function (e) {
    var name = mapCode(e.charCode || e.keyCode || 0);
    if (name) {
      keyExpiry[name] = now() + PRESS_HOLD_MS;
      if (e.preventDefault) e.preventDefault();
    }
  }, false);
  window.addEventListener("blur", function () {
    keyHeld = {};
    keyExpiry = {};
  }, false);
  function isDown(name) {
    if (keyHeld[name]) return true;
    var exp = keyExpiry[name];
    return !!exp && exp > now();
  }

  // ---------------------------------------------------------------
  // Touch: left stick = drive/turn. Right stick = swing (dx) plus a
  // blended dig arc on dy (down = boom down + stick in, i.e. pull the
  // bucket toward you and into the ground). DIG button = F.
  // ---------------------------------------------------------------
  var leftStick = null, rightStick = null;
  var STICK_RANGE = 60;
  var digHeld = false;

  function findTouch(list, id) {
    for (var i = 0; i < list.length; i++) {
      if (list[i].identifier === id) return list[i];
    }
    return null;
  }
  canvas.addEventListener("touchstart", function (e) {
    e.preventDefault();
    var half = canvas.clientWidth / 2;
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.clientX < half && !leftStick) {
        leftStick = { id: t.identifier, sx: t.clientX, sy: t.clientY, dx: 0, dy: 0 };
      } else if (t.clientX >= half && !rightStick) {
        rightStick = { id: t.identifier, sx: t.clientX, sy: t.clientY, dx: 0, dy: 0 };
      }
    }
  }, false);
  canvas.addEventListener("touchmove", function (e) {
    e.preventDefault();
    var t;
    if (leftStick) {
      t = findTouch(e.touches, leftStick.id);
      if (t) { leftStick.dx = t.clientX - leftStick.sx; leftStick.dy = t.clientY - leftStick.sy; }
    }
    if (rightStick) {
      t = findTouch(e.touches, rightStick.id);
      if (t) { rightStick.dx = t.clientX - rightStick.sx; rightStick.dy = t.clientY - rightStick.sy; }
    }
  }, false);
  function endTouches(e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var id = e.changedTouches[i].identifier;
      if (leftStick && leftStick.id === id) leftStick = null;
      if (rightStick && rightStick.id === id) rightStick = null;
    }
  }
  canvas.addEventListener("touchend", endTouches, false);
  canvas.addEventListener("touchcancel", endTouches, false);

  var mouseStick = null;
  canvas.addEventListener("mousedown", function (e) {
    if (e.preventDefault) e.preventDefault();
    var half = canvas.clientWidth / 2;
    if (e.clientX < half && !leftStick) {
      leftStick = { id: "mouse", sx: e.clientX, sy: e.clientY, dx: 0, dy: 0 };
      mouseStick = "left";
    } else if (e.clientX >= half && !rightStick) {
      rightStick = { id: "mouse", sx: e.clientX, sy: e.clientY, dx: 0, dy: 0 };
      mouseStick = "right";
    }
  }, false);
  document.addEventListener("mouseup", function () {
    if (mouseStick === "left" && leftStick && leftStick.id === "mouse") leftStick = null;
    if (mouseStick === "right" && rightStick && rightStick.id === "mouse") rightStick = null;
    mouseStick = null;
  }, false);
  document.addEventListener("mousemove", function (e) {
    if (mouseStick === "left" && leftStick && leftStick.id === "mouse") {
      leftStick.dx = e.clientX - leftStick.sx; leftStick.dy = e.clientY - leftStick.sy;
    } else if (mouseStick === "right" && rightStick && rightStick.id === "mouse") {
      rightStick.dx = e.clientX - rightStick.sx; rightStick.dy = e.clientY - rightStick.sy;
    }
  }, false);
  canvas.addEventListener("contextmenu", function (e) {
    if (e.preventDefault) e.preventDefault();
  }, false);

  var digEl = document.getElementById("dig");
  function digOn(e) {
    if (e.preventDefault) e.preventDefault();
    if (e.stopPropagation) e.stopPropagation();
    digHeld = true;
  }
  function digOff() { digHeld = false; }
  digEl.addEventListener("touchstart", digOn, false);
  digEl.addEventListener("touchend", function (e) { digOn(e); digOff(); }, false);
  digEl.addEventListener("touchcancel", digOff, false);
  digEl.addEventListener("mousedown", digOn, false);
  document.addEventListener("mouseup", digOff, false);

  function clampf(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  // ---------------------------------------------------------------
  // Dig / dump: move dirt between the ground and the bucket over a
  // weighted 5-cell footprint so pits and piles come out rounded.
  // ---------------------------------------------------------------
  function moveDirt(cx, cz, amt) {
    // amt < 0 digs, > 0 dumps. Returns how much actually moved.
    var wts = [[0,0,0.5],[1,0,0.125],[-1,0,0.125],[0,1,0.125],[0,-1,0.125]];
    var moved = 0;
    for (var i = 0; i < wts.length; i++) {
      var x = cx + wts[i][0], z = cz + wts[i][1];
      if (x < 0 || x >= W || z < 0 || z >= D) continue;
      var idx2 = z * W + x;
      var want = amt * wts[i][2];
      var nh = clampf(H[idx2] + want, MINH, MAXH);
      moved += nh - H[idx2];
      H[idx2] = nh;
    }
    if (moved !== 0) terrainDirty = true;
    return moved;
  }

  function updateMachine(dt) {
    var drive = 0, turn = 0, swing = 0, boom = 0, stick = 0;
    if (isDown("fwd"))    drive += 1;
    if (isDown("back"))   drive -= 1;
    if (isDown("turnL"))  turn -= 1;
    if (isDown("turnR"))  turn += 1;
    if (isDown("swingL")) swing -= 1;
    if (isDown("swingR")) swing += 1;
    if (isDown("boomUp")) boom += 1;
    if (isDown("boomDn")) boom -= 1;
    if (isDown("stickOut")) stick += 1;
    if (isDown("stickIn"))  stick -= 1;
    var digging = digHeld || isDown("dig");

    if (leftStick) {
      drive += clampf(-leftStick.dy / STICK_RANGE, -1, 1);
      turn  += clampf( leftStick.dx / STICK_RANGE, -1, 1);
    }
    if (rightStick) {
      swing += clampf(rightStick.dx / STICK_RANGE, -1, 1);
      var arm = clampf(rightStick.dy / STICK_RANGE, -1, 1); // down = dig pull
      boom  += -arm * 0.6;
      stick += -arm * 1.0;
    }

    drive = clampf(drive, -1, 1);
    turn = clampf(turn, -1, 1);
    swing = clampf(swing, -1, 1);
    boom = clampf(boom, -1, 1);
    stick = clampf(stick, -1, 1);

    // Tracks: slow, deliberate, instantish response.
    exc.v += (drive * DRIVE_MAX - exc.v) * Math.min(1, 6 * dt);
    exc.trackYaw -= turn * TURN_RATE * dt;
    var fx = -Math.sin(exc.trackYaw), fz = -Math.cos(exc.trackYaw);
    exc.x = clampf(exc.x + fx * exc.v * dt, 2, W - 2);
    exc.z = clampf(exc.z + fz * exc.v * dt, 2, D - 2);

    // Ride the terrain (including holes you dug under yourself).
    var gh = hAt(Math.floor(exc.x), Math.floor(exc.z));
    exc.y += (gh - exc.y) * Math.min(1, 6 * dt);

    // Upper works
    exc.cabRel -= swing * SWING_RATE * dt;
    exc.boom = clampf(exc.boom + boom * BOOM_RATE * dt, BOOM_MIN, BOOM_MAX);
    exc.stick = clampf(exc.stick + stick * STICK_RATE * dt, STICK_MIN, STICK_MAX);

    // Dig / dump at the bucket tip
    if (digging) {
      var tip = bucketTip();
      var cx = Math.floor(tip.x), cz = Math.floor(tip.z);
      if (cx >= 0 && cx < W && cz >= 0 && cz < D) {
        var h = hAt(cx, cz);
        if (tip.y <= h + 0.12 && exc.bucket < CAP) {
          var want = Math.min(DIG_RATE * dt, CAP - exc.bucket);
          var moved = moveDirt(cx, cz, -want);
          exc.bucket += -moved;
        } else if (exc.bucket > 0.01 && tip.y > h + 0.25) {
          var give = Math.min(DIG_RATE * dt, exc.bucket);
          var added = moveDirt(cx, cz, give);
          exc.bucket -= added;
          if (exc.bucket < 0) exc.bucket = 0;
        }
      }
    }

    // Throttled remesh
    remeshCooldown -= dt;
    if (terrainDirty && remeshCooldown <= 0) {
      remesh();
      remeshCooldown = 0.12;
    }
  }

  // ---------------------------------------------------------------
  // Main loop
  // ---------------------------------------------------------------
  var SKY = [0.55, 0.75, 0.95];
  gl.clearColor(SKY[0], SKY[1], SKY[2], 1);
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);

  gl.uniform1i(loc.uTex, 0);
  gl.uniform3f(loc.uSky, SKY[0], SKY[1], SKY[2]);
  gl.uniform1f(loc.uFogStart, 26.0);
  gl.uniform1f(loc.uFogEnd, 52.0);

  var statEl = document.getElementById("stat");
  var frames = 0, fpsTime = 0, lastFps = 0, statTime = 0;
  var last = now();
  var camYaw = exc.trackYaw;

  remesh();

  function drawPart(p, m) {
    gl.uniformMatrix4fv(loc.uModel, false, m);
    gl.drawElements(gl.TRIANGLES, p.count, gl.UNSIGNED_SHORT, p.start * 2);
  }

  function frame() {
    var t = now();
    var dt = (t - last) / 1000;
    last = t;
    if (dt > 0.1) dt = 0.1;

    resize();
    updateMachine(dt);

    // Chase camera behind the CAB heading, so the bucket always
    // stays framed; swinging the cab orbits your view of the site.
    var hd = exc.trackYaw + exc.cabRel;
    var dyaw = hd - camYaw;
    while (dyaw >  Math.PI) dyaw -= 2 * Math.PI;
    while (dyaw < -Math.PI) dyaw += 2 * Math.PI;
    camYaw += dyaw * Math.min(1, 3.5 * dt);

    var CAM_DIST = 8.5, CAM_PITCH = -0.42;
    var ccp = Math.cos(CAM_PITCH), csp = Math.sin(CAM_PITCH);
    var cfx = -Math.sin(camYaw) * ccp;
    var cfy = csp;
    var cfz = -Math.cos(camYaw) * ccp;
    var ex = exc.x - cfx * CAM_DIST;
    var ey = (exc.y + 1.4) - cfy * CAM_DIST;
    var ez = exc.z - cfz * CAM_DIST;
    if (ey < exc.y + 1.2) ey = exc.y + 1.2;

    perspective(proj, 70 * Math.PI / 180, canvas.width / canvas.height, 0.1, 120);
    viewMatrix(view, ex, ey, ez, camYaw, CAM_PITCH);

    gl.uniformMatrix4fv(loc.uProj, false, proj);
    gl.uniformMatrix4fv(loc.uView, false, view);

    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    // Terrain
    bindBuffers(tVbo, tIbo);
    gl.uniformMatrix4fv(loc.uModel, false, identity);
    gl.drawElements(gl.TRIANGLES, terrainIndexCount, gl.UNSIGNED_SHORT, 0);

    // Machine: chained transforms
    bindBuffers(mVbo, mIbo);
    setTRY(baseMat, exc.x, exc.y, exc.z, exc.trackYaw);
    drawPart(P_BASE, baseMat);

    setTRY(linkMat, 0, CAB_H, 0, exc.cabRel);
    mul(cabMat, baseMat, linkMat);
    drawPart(P_CAB, cabMat);

    setTRX(linkMat, 0, PIV_H, -PIV_F, exc.boom);
    mul(boomMat, cabMat, linkMat);
    drawPart(P_BOOM, boomMat);

    setTRX(linkMat, 0, 0, -BOOM_L, exc.stick);
    mul(stickMat, boomMat, linkMat);
    drawPart(P_STICK, stickMat);

    setTRX(linkMat, 0, 0, -STICK_L, BUCKET_ANG);
    mul(bucketMat, stickMat, linkMat);
    drawPart(P_BUCKET, bucketMat);
    if (exc.bucket > 0.08) drawPart(P_LOAD, bucketMat);

    // HUD
    frames++;
    fpsTime += dt;
    statTime += dt;
    if (fpsTime >= 1) { lastFps = frames; frames = 0; fpsTime = 0; }
    if (statTime >= 0.25) {
      statTime = 0;
      statEl.innerHTML = lastFps + " fps &#183; bucket " +
        Math.round(100 * exc.bucket / CAP) + "%";
    }

    raf(frame);
  }

  resize();
  raf(frame);
})();
</script>
</body>
</html>
