<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BerryFly</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
  #gl { display:block; width:100%; height:100%; touch-action:none; }
  #hud {
    position:absolute; top:0; left:0; right:0;
    font-family:monospace; color:#fff; pointer-events:none;
    text-shadow:1px 1px 0 rgba(0,0,0,0.6);
  }
  #hud .title { position:absolute; top:6px; left:8px; font-size:12px; opacity:0.85; }
  #hud .stat  { position:absolute; top:6px; right:8px; font-size:12px; opacity:0.85; }
  #err {
    position:absolute; left:0; right:0; top:40%; text-align:center;
    color:#f66; font-family:monospace; font-size:14px; display:none; padding:0 20px;
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <div class="title">BerryFly &#183; WASD throttle+yaw &#183; IJKL pitch+roll &#183; touch: dual sticks</div>
  <div class="stat" id="stat"></div>
</div>
<div id="err">WebGL not available on this device/browser.</div>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------
  // Compat shims (BB10 WebKit)
  // ---------------------------------------------------------------
  var raf = window.requestAnimationFrame ||
            window.webkitRequestAnimationFrame ||
            function (cb) { return setTimeout(function () { cb(now()); }, 16); };

  function now() {
    return (window.performance && window.performance.now)
      ? window.performance.now()
      : Date.now();
  }

  // ---------------------------------------------------------------
  // Canvas + GL context
  // ---------------------------------------------------------------
  var canvas = document.getElementById("gl");
  var gl = null;
  var ctxNames = ["webgl", "experimental-webgl"];
  for (var ci = 0; ci < ctxNames.length && !gl; ci++) {
    try { gl = canvas.getContext(ctxNames[ci], { antialias: false }); } catch (e) {}
  }
  if (!gl) {
    document.getElementById("err").style.display = "block";
    return;
  }

  var MAX_DIM = 720;
  function resize() {
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.clientWidth  * dpr;
    var h = canvas.clientHeight * dpr;
    var scale = Math.min(1, MAX_DIM / Math.max(w, h));
    var bw = Math.max(1, Math.floor(w * scale));
    var bh = Math.max(1, Math.floor(h * scale));
    if (canvas.width !== bw || canvas.height !== bh) {
      canvas.width = bw;
      canvas.height = bh;
    }
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener("resize", resize, false);
  window.addEventListener("orientationchange", resize, false);

  // ---------------------------------------------------------------
  // Shaders
  // ---------------------------------------------------------------
  var VSH =
    "attribute vec3 aPos;\n" +
    "attribute vec2 aUV;\n" +
    "attribute float aShade;\n" +
    "uniform mat4 uProj;\n" +
    "uniform mat4 uView;\n" +
    "uniform mat4 uModel;\n" +
    "varying vec2 vUV;\n" +
    "varying float vShade;\n" +
    "varying float vDist;\n" +
    "void main() {\n" +
    "  vec4 eye = uView * uModel * vec4(aPos, 1.0);\n" +
    "  vDist = length(eye.xyz);\n" +
    "  vUV = aUV;\n" +
    "  vShade = aShade;\n" +
    "  gl_Position = uProj * eye;\n" +
    "}\n";

  var FSH =
    "precision mediump float;\n" +
    "uniform sampler2D uTex;\n" +
    "uniform vec3 uSky;\n" +
    "uniform float uFogStart;\n" +
    "uniform float uFogEnd;\n" +
    "varying vec2 vUV;\n" +
    "varying float vShade;\n" +
    "varying float vDist;\n" +
    "void main() {\n" +
    "  vec4 tex = texture2D(uTex, vUV);\n" +
    "  vec3 col = tex.rgb * vShade;\n" +
    "  float f = clamp((vDist - uFogStart) / (uFogEnd - uFogStart), 0.0, 1.0);\n" +
    "  gl_FragColor = vec4(mix(col, uSky, f), tex.a);\n" +
    "}\n";

  function makeShader(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(s) || "shader compile failed");
    }
    return s;
  }

  var prog = gl.createProgram();
  gl.attachShader(prog, makeShader(gl.VERTEX_SHADER, VSH));
  gl.attachShader(prog, makeShader(gl.FRAGMENT_SHADER, FSH));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(prog) || "link failed");
  }
  gl.useProgram(prog);

  var loc = {
    aPos:   gl.getAttribLocation(prog, "aPos"),
    aUV:    gl.getAttribLocation(prog, "aUV"),
    aShade: gl.getAttribLocation(prog, "aShade"),
    uProj:  gl.getUniformLocation(prog, "uProj"),
    uView:  gl.getUniformLocation(prog, "uView"),
    uModel: gl.getUniformLocation(prog, "uModel"),
    uTex:   gl.getUniformLocation(prog, "uTex"),
    uSky:   gl.getUniformLocation(prog, "uSky"),
    uFogStart: gl.getUniformLocation(prog, "uFogStart"),
    uFogEnd:   gl.getUniformLocation(prog, "uFogEnd")
  };

  // ---------------------------------------------------------------
  // Atlas: row 0 terrain, row 2 drone bits + shadow
  // ---------------------------------------------------------------
  var TILE = 16;
  var ATLAS = 64;

  function rnd(seed) {
    var s = seed;
    return function () {
      s = (s * 1103515245 + 12345) & 0x7fffffff;
      return s / 0x7fffffff;
    };
  }

  function noiseTile(x, col, row, r, cr, cg, cb, lo, hi) {
    var i, j, v;
    for (j = 0; j < TILE; j++) for (i = 0; i < TILE; i++) {
      v = lo + r() * (hi - lo);
      x.fillStyle = "rgb(" + Math.floor(cr * v) + "," + Math.floor(cg * v) + "," + Math.floor(cb * v) + ")";
      x.fillRect(col * TILE + i, row * TILE + j, 1, 1);
    }
  }

  function buildAtlas() {
    var c = document.createElement("canvas");
    c.width = ATLAS; c.height = ATLAS;
    var x = c.getContext("2d");
    var r = rnd(1337);
    var i, j, v;

    // (0,0) grass top
    noiseTile(x, 0, 0, r, 70, 160, 60, 0.75, 1.0);
    // (1,0) grass side
    for (j = 0; j < TILE; j++) for (i = 0; i < TILE; i++) {
      v = 0.7 + r() * 0.3;
      if (j < 3 || (j === 3 && r() > 0.5)) {
        x.fillStyle = "rgb(" + Math.floor(75 * v) + "," + Math.floor(150 * v) + "," + Math.floor(55 * v) + ")";
      } else {
        x.fillStyle = "rgb(" + Math.floor(134 * v) + "," + Math.floor(96 * v) + "," + Math.floor(67 * v) + ")";
      }
      x.fillRect(TILE + i, j, 1, 1);
    }
    // (2,0) dirt, (3,0) stone
    noiseTile(x, 2, 0, r, 134, 96, 67, 0.7, 1.0);
    noiseTile(x, 3, 0, r, 128, 128, 128, 0.75, 1.0);

    // (0,2) drone body (dark gray), (1,2) nose (red), (2,2) blade (near-black)
    noiseTile(x, 0, 2, r, 70, 74, 80, 0.85, 1.0);
    noiseTile(x, 1, 2, r, 210, 60, 50, 0.9, 1.0);
    noiseTile(x, 2, 2, r, 30, 30, 34, 0.9, 1.0);

    // (3,2) blob shadow: dark pixel circle on transparent, alpha only
    var cx = 3 * TILE + 8, cyy = 2 * TILE + 8;
    for (j = 0; j < TILE; j++) for (i = 0; i < TILE; i++) {
      var dx = (3 * TILE + i + 0.5) - cx;
      var dy = (2 * TILE + j + 0.5) - cyy;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < 7.5) {
        var a = d < 5.5 ? 0.4 : 0.2;
        x.fillStyle = "rgba(0,0,0," + a + ")";
        x.fillRect(3 * TILE + i, 2 * TILE + j, 1, 1);
      }
    }
    return c;
  }

  var tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, buildAtlas());
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  function tileUV(col, row) {
    var u0 = (col * TILE + 0.5) / ATLAS;
    var u1 = ((col + 1) * TILE - 0.5) / ATLAS;
    var v0 = (row * TILE + 0.5) / ATLAS;
    var v1 = ((row + 1) * TILE - 0.5) / ATLAS;
    return [u0, v0, u1, v1];
  }
  var UV_GRASS_TOP  = tileUV(0, 0);
  var UV_GRASS_SIDE = tileUV(1, 0);
  var UV_STONE      = tileUV(3, 0);
  var UV_BODY       = tileUV(0, 2);
  var UV_NOSE       = tileUV(1, 2);
  var UV_BLADE      = tileUV(2, 2);
  var UV_SHADOW     = tileUV(3, 2);

  // ---------------------------------------------------------------
  // Geometry
  // ---------------------------------------------------------------
  var verts = [];
  var idx = [];
  var vCount = 0;

  function quad(p0, p1, p2, p3, uv, shade) {
    var us = [uv[0], uv[1],  uv[2], uv[1],  uv[2], uv[3],  uv[0], uv[3]];
    var ps = [p0, p1, p2, p3];
    for (var k = 0; k < 4; k++) {
      verts.push(ps[k][0], ps[k][1], ps[k][2], us[k * 2], us[k * 2 + 1], shade);
    }
    idx.push(vCount, vCount + 1, vCount + 2, vCount, vCount + 2, vCount + 3);
    vCount += 4;
  }

  var SH_TOP = 1.0, SH_X = 0.8, SH_Z = 0.65, SH_BOT = 0.5;

  function box(x0, y0, z0, x1, y1, z1, uv) {
    quad([x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0], uv, SH_TOP);
    quad([x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1], uv, SH_BOT);
    quad([x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1], uv, SH_Z);
    quad([x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0], uv, SH_Z);
    quad([x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1], uv, SH_X);
    quad([x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0], uv, SH_X);
  }

  // ----- World -----
  var W = 48, D = 48;
  var gx, gz;
  for (gz = 0; gz < D; gz++) {
    for (gx = 0; gx < W; gx++) {
      var tint = ((gx + gz) % 2 === 0) ? 1.0 : 0.94;
      quad([gx, 1, gz + 1], [gx + 1, 1, gz + 1], [gx + 1, 1, gz], [gx, 1, gz],
           UV_GRASS_TOP, SH_TOP * tint);
    }
  }
  for (gx = 0; gx < W; gx++) {
    quad([gx, 0, D], [gx + 1, 0, D], [gx + 1, 1, D], [gx, 1, D], UV_GRASS_SIDE, SH_Z);
    quad([gx + 1, 0, 0], [gx, 0, 0], [gx, 1, 0], [gx + 1, 1, 0], UV_GRASS_SIDE, SH_Z);
  }
  for (gz = 0; gz < D; gz++) {
    quad([W, 0, gz + 1], [W, 0, gz], [W, 1, gz], [W, 1, gz + 1], UV_GRASS_SIDE, SH_X);
    quad([0, 0, gz], [0, 0, gz + 1], [0, 1, gz + 1], [0, 1, gz], UV_GRASS_SIDE, SH_X);
  }

  // Stone towers: obstacles. Hitting one restarts the flight.
  var towers = []; // {x, z, h} - block column from y=1 to y=1+h
  function tower(bx, bz, h) {
    for (var y = 1; y <= h; y++) box(bx, y, bz, bx + 1, y + 1, bz + 1, UV_STONE);
    towers.push({ x: bx, z: bz, h: h });
  }
  tower(10, 10, 3);
  tower(38, 12, 5);
  tower(24, 24, 7);
  tower(14, 36, 4);
  tower(36, 38, 2);
  tower(8, 40, 6);
  tower(18, 16, 5);
  tower(30, 8, 4);
  tower(6, 24, 8);
  tower(42, 26, 6);
  tower(28, 34, 3);
  tower(20, 42, 7);
  tower(33, 20, 9);
  tower(12, 30, 2);

  var worldIndexCount = idx.length;

  // ----- Blob shadow quad (drawn with blending, own model matrix) -----
  var shadowStart = idx.length;
  quad([-0.55, 0, 0.55], [0.55, 0, 0.55], [0.55, 0, -0.55], [-0.55, 0, -0.55],
       UV_SHADOW, 1.0);
  var shadowCount = idx.length - shadowStart;

  // ----- Drone (local space; forward is -Z, red nose marks it) -----
  var droneStatics = { start: idx.length, count: 0 };
  box(-0.22, -0.06, -0.30, 0.22, 0.10, 0.30, UV_BODY);         // hull
  box(-0.10, -0.02, -0.40, 0.10, 0.08, -0.30, UV_NOSE);        // nose
  box(-0.60, 0.02, -0.045, 0.60, 0.09, 0.045, UV_BODY);        // arm X
  box(-0.045, 0.02, -0.60, 0.045, 0.09, 0.60, UV_BODY);        // arm Z
  box(-0.16, -0.18, -0.05, -0.08, -0.06, 0.05, UV_BODY);       // skid L
  box(0.08, -0.18, -0.05, 0.16, -0.06, 0.05, UV_BODY);         // skid R
  droneStatics.count = idx.length - droneStatics.start;

  // Rotors: a two-blade bar each, spun about Y at the motor.
  var rotors = [];
  function rotor(mx, mz, dir) {
    var rp = { start: idx.length, count: 0, pos: [mx, 0.11, mz], dir: dir, phase: Math.random() * 6.28 };
    box(-0.30, 0.0, -0.035, 0.30, 0.025, 0.035, UV_BLADE);
    rp.count = idx.length - rp.start;
    rotors.push(rp);
  }
  rotor( 0.55, 0,  1);
  rotor(-0.55, 0, -1);
  rotor(0,  0.55, -1);
  rotor(0, -0.55,  1);

  // ----- Upload -----
  var vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.STATIC_DRAW);

  var ibo = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);

  var STRIDE = 6 * 4;
  gl.enableVertexAttribArray(loc.aPos);
  gl.vertexAttribPointer(loc.aPos, 3, gl.FLOAT, false, STRIDE, 0);
  gl.enableVertexAttribArray(loc.aUV);
  gl.vertexAttribPointer(loc.aUV, 2, gl.FLOAT, false, STRIDE, 12);
  gl.enableVertexAttribArray(loc.aShade);
  gl.vertexAttribPointer(loc.aShade, 1, gl.FLOAT, false, STRIDE, 20);

  // ---------------------------------------------------------------
  // mat4
  // ---------------------------------------------------------------
  function mat4() { var m = new Float32Array(16); m[0]=m[5]=m[10]=m[15]=1; return m; }
  var mulTmp = new Float32Array(16);
  function mul(out, a, b) {
    var r, c, i, s;
    for (c = 0; c < 4; c++) for (r = 0; r < 4; r++) {
      s = 0;
      for (i = 0; i < 4; i++) s += a[i * 4 + r] * b[c * 4 + i];
      mulTmp[c * 4 + r] = s;
    }
    for (i = 0; i < 16; i++) out[i] = mulTmp[i];
  }
  function setTRY(out, tx, ty, tz, yaw) {
    var cy = Math.cos(yaw), sy = Math.sin(yaw);
    out[0]=cy;  out[1]=0; out[2]=-sy; out[3]=0;
    out[4]=0;   out[5]=1; out[6]=0;   out[7]=0;
    out[8]=sy;  out[9]=0; out[10]=cy; out[11]=0;
    out[12]=tx; out[13]=ty; out[14]=tz; out[15]=1;
  }
  function setRX(out, ang) {
    var c = Math.cos(ang), s = Math.sin(ang);
    out[0]=1; out[1]=0;  out[2]=0;  out[3]=0;
    out[4]=0; out[5]=c;  out[6]=s;  out[7]=0;
    out[8]=0; out[9]=-s; out[10]=c; out[11]=0;
    out[12]=0; out[13]=0; out[14]=0; out[15]=1;
  }
  function setRZ(out, ang) {
    var c = Math.cos(ang), s = Math.sin(ang);
    out[0]=c;  out[1]=s; out[2]=0; out[3]=0;
    out[4]=-s; out[5]=c; out[6]=0; out[7]=0;
    out[8]=0;  out[9]=0; out[10]=1; out[11]=0;
    out[12]=0; out[13]=0; out[14]=0; out[15]=1;
  }
  function perspective(out, fovy, aspect, near, far) {
    var f = 1 / Math.tan(fovy / 2);
    var nf = 1 / (near - far);
    out[0]=f/aspect; out[1]=0; out[2]=0;              out[3]=0;
    out[4]=0;        out[5]=f; out[6]=0;              out[7]=0;
    out[8]=0;        out[9]=0; out[10]=(far+near)*nf; out[11]=-1;
    out[12]=0;       out[13]=0;out[14]=2*far*near*nf; out[15]=0;
  }
  function viewMatrix(out, ex, ey, ez, yaw, pitch) {
    var cy = Math.cos(yaw),  sy = Math.sin(yaw);
    var cp = Math.cos(pitch), sp = Math.sin(pitch);
    var rx = [cy, sy * sp, sy * cp];
    var ry = [0,  cp,     -sp];
    var rz = [-sy, cy * sp, cy * cp];
    out[0]=rx[0]; out[1]=rx[1]; out[2]=rx[2];  out[3]=0;
    out[4]=ry[0]; out[5]=ry[1]; out[6]=ry[2];  out[7]=0;
    out[8]=rz[0]; out[9]=rz[1]; out[10]=rz[2]; out[11]=0;
    out[12]=-(rx[0]*ex + ry[0]*ey + rz[0]*ez);
    out[13]=-(rx[1]*ex + ry[1]*ey + rz[1]*ez);
    out[14]=-(rx[2]*ex + ry[2]*ey + rz[2]*ez);
    out[15]=1;
  }

  var proj = mat4();
  var view = mat4();
  var identity = mat4();
  var bodyMat = mat4();
  var tiltMat = mat4();
  var tmpMat = mat4();
  var rotorMat = mat4();
  var shadowMat = mat4();

  // ---------------------------------------------------------------
  // Drone state
  // ---------------------------------------------------------------
  var GROUND_Y = 1;
  var MIN_ALT = GROUND_Y + 0.25; // skid clearance
  var drone = {
    x: W / 2, y: GROUND_Y + 3, z: D / 2 + 10,
    vx: 0, vy: 0, vz: 0,
    yaw: Math.PI,
    tiltP: 0, tiltR: 0,   // smoothed control tilt (input units, -1..1)
    rotorPhase: 0
  };
  var ACC = 11;        // horizontal accel at full tilt (blocks/s^2)
  var DRAG = 1.6;      // per-second horizontal drag
  var CLIMB = 4.2;     // max climb/descend rate
  var YAW_RATE = 2.1;
  var TILT_MAX = 0.42; // visual tilt (rad) at full input
  var TILT_RESP = 7;   // how fast tilt follows input

  var crashFlash = 0;  // seconds remaining of "CRASHED" notice

  function resetDrone() {
    drone.x = W / 2;
    drone.y = GROUND_Y + 3;
    drone.z = D / 2 + 10;
    drone.vx = 0; drone.vy = 0; drone.vz = 0;
    drone.yaw = Math.PI;
    drone.tiltP = 0; drone.tiltR = 0;
    crashFlash = 1.2;
    camYaw = drone.yaw; // snap the chase cam, no slow swing-around
  }

  // ---------------------------------------------------------------
  // Keyboard: same multi-path BB10 handling as BerryCraft.
  // Left stick  = WASD  (W/S climb, A/D yaw)
  // Right stick = IJKL  (I/K pitch, J/L roll); arrows also = right stick
  // ---------------------------------------------------------------
  var keyHeld = {};
  var keyExpiry = {};
  var PRESS_HOLD_MS = 300;

  function mapCode(code) {
    switch (code) {
      case 87: case 119: return "up";      // W
      case 83: case 115: return "down";    // S
      case 65: case 97:  return "yawR";    // A (reversed)
      case 68: case 100: return "yawL";    // D (reversed)
      case 73: case 105: case 38: return "pitchF"; // I, Up
      case 75: case 107: case 40: return "pitchB"; // K, Down
      case 74: case 106: case 37: return "rollL";  // J, Left
      case 76: case 108: case 39: return "rollR";  // L, Right
    }
    return null;
  }

  function mapKeyEvent(e) {
    var name = null;
    if (e.key) {
      switch (e.key) {
        case "w": case "W": name = "up"; break;
        case "s": case "S": name = "down"; break;
        case "a": case "A": name = "yawR"; break;
        case "d": case "D": name = "yawL"; break;
        case "i": case "I": case "ArrowUp":    case "Up":    name = "pitchF"; break;
        case "k": case "K": case "ArrowDown":  case "Down":  name = "pitchB"; break;
        case "j": case "J": case "ArrowLeft":  case "Left":  name = "rollL";  break;
        case "l": case "L": case "ArrowRight": case "Right": name = "rollR";  break;
      }
    }
    if (!name && e.keyIdentifier) {
      var ki = e.keyIdentifier;
      if (ki.indexOf("U+") === 0) name = mapCode(parseInt(ki.slice(2), 16));
      else if (ki === "Up")    name = "pitchF";
      else if (ki === "Down")  name = "pitchB";
      else if (ki === "Left")  name = "rollL";
      else if (ki === "Right") name = "rollR";
    }
    if (!name && e.keyCode) name = mapCode(e.keyCode);
    return name;
  }

  document.addEventListener("keydown", function (e) {
    var name = mapKeyEvent(e);
    if (name) {
      keyHeld[name] = true;
      keyExpiry[name] = now() + PRESS_HOLD_MS;
      if (e.preventDefault) e.preventDefault();
    }
  }, false);
  document.addEventListener("keyup", function (e) {
    var name = mapKeyEvent(e);
    if (name) {
      keyHeld[name] = false;
      keyExpiry[name] = 0;
    }
  }, false);
  document.addEventListener("keypress", function (e) {
    var name = mapCode(e.charCode || e.keyCode || 0);
    if (name) {
      keyExpiry[name] = now() + PRESS_HOLD_MS;
      if (e.preventDefault) e.preventDefault();
    }
  }, false);
  window.addEventListener("blur", function () {
    keyHeld = {};
    keyExpiry = {};
  }, false);

  function isDown(name) {
    if (keyHeld[name]) return true;
    var exp = keyExpiry[name];
    return !!exp && exp > now();
  }

  // ---------------------------------------------------------------
  // Touch: dual virtual sticks. Left half stick = climb (y) + yaw (x).
  // Right half stick = pitch (y) + roll (x). Mouse drives whichever
  // stick matches the half it pressed, so it works identically.
  // ---------------------------------------------------------------
  var leftStick = null;   // {id, sx, sy, dx, dy}
  var rightStick = null;
  var STICK_RANGE = 60;

  function findTouch(list, id) {
    for (var i = 0; i < list.length; i++) {
      if (list[i].identifier === id) return list[i];
    }
    return null;
  }

  canvas.addEventListener("touchstart", function (e) {
    e.preventDefault();
    var half = canvas.clientWidth / 2;
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.clientX < half && !leftStick) {
        leftStick = { id: t.identifier, sx: t.clientX, sy: t.clientY, dx: 0, dy: 0 };
      } else if (t.clientX >= half && !rightStick) {
        rightStick = { id: t.identifier, sx: t.clientX, sy: t.clientY, dx: 0, dy: 0 };
      }
    }
  }, false);

  canvas.addEventListener("touchmove", function (e) {
    e.preventDefault();
    var t;
    if (leftStick) {
      t = findTouch(e.touches, leftStick.id);
      if (t) {
        leftStick.dx = t.clientX - leftStick.sx;
        leftStick.dy = t.clientY - leftStick.sy;
      }
    }
    if (rightStick) {
      t = findTouch(e.touches, rightStick.id);
      if (t) {
        rightStick.dx = t.clientX - rightStick.sx;
        rightStick.dy = t.clientY - rightStick.sy;
      }
    }
  }, false);

  function endTouches(e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var id = e.changedTouches[i].identifier;
      if (leftStick && leftStick.id === id) leftStick = null;
      if (rightStick && rightStick.id === id) rightStick = null;
    }
  }
  canvas.addEventListener("touchend", endTouches, false);
  canvas.addEventListener("touchcancel", endTouches, false);

  var mouseStick = null; // "left" | "right"
  canvas.addEventListener("mousedown", function (e) {
    if (e.preventDefault) e.preventDefault();
    var half = canvas.clientWidth / 2;
    if (e.clientX < half && !leftStick) {
      leftStick = { id: "mouse", sx: e.clientX, sy: e.clientY, dx: 0, dy: 0 };
      mouseStick = "left";
    } else if (e.clientX >= half && !rightStick) {
      rightStick = { id: "mouse", sx: e.clientX, sy: e.clientY, dx: 0, dy: 0 };
      mouseStick = "right";
    }
  }, false);
  document.addEventListener("mouseup", function () {
    if (mouseStick === "left" && leftStick && leftStick.id === "mouse") leftStick = null;
    if (mouseStick === "right" && rightStick && rightStick.id === "mouse") rightStick = null;
    mouseStick = null;
  }, false);
  document.addEventListener("mousemove", function (e) {
    if (mouseStick === "left" && leftStick && leftStick.id === "mouse") {
      leftStick.dx = e.clientX - leftStick.sx;
      leftStick.dy = e.clientY - leftStick.sy;
    } else if (mouseStick === "right" && rightStick && rightStick.id === "mouse") {
      rightStick.dx = e.clientX - rightStick.sx;
      rightStick.dy = e.clientY - rightStick.sy;
    }
  }, false);
  canvas.addEventListener("contextmenu", function (e) {
    if (e.preventDefault) e.preventDefault();
  }, false);

  function clampf(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  // ---------------------------------------------------------------
  // Flight model (arcade): tilt drives horizontal acceleration in
  // the drone's frame, drag settles it, throttle sets climb rate.
  // ---------------------------------------------------------------
  function updateDrone(dt) {
    var up = 0, yaw = 0, pitch = 0, roll = 0;

    if (isDown("up"))     up += 1;
    if (isDown("down"))   up -= 1;
    if (isDown("yawL"))   yaw -= 1;
    if (isDown("yawR"))   yaw += 1;
    if (isDown("pitchF")) pitch += 1;
    if (isDown("pitchB")) pitch -= 1;
    if (isDown("rollL"))  roll -= 1;
    if (isDown("rollR"))  roll += 1;

    if (leftStick) {
      up  += clampf(-leftStick.dy / STICK_RANGE, -1, 1);
      yaw += clampf( leftStick.dx / STICK_RANGE, -1, 1);
    }
    if (rightStick) {
      pitch += clampf(-rightStick.dy / STICK_RANGE, -1, 1);
      roll  += clampf( rightStick.dx / STICK_RANGE, -1, 1);
    }

    up    = clampf(up, -1, 1);
    yaw   = clampf(yaw, -1, 1);
    pitch = clampf(pitch, -1, 1);
    roll  = clampf(roll, -1, 1);

    drone.yaw += yaw * YAW_RATE * dt;

    // Tilt eases toward the stick, giving the drone its inertia feel.
    var k = Math.min(1, TILT_RESP * dt);
    drone.tiltP += (pitch - drone.tiltP) * k;
    drone.tiltR += (roll  - drone.tiltR) * k;

    // Accelerate along the tilted frame. forward = (-sin yaw, -cos yaw)
    var sy = Math.sin(drone.yaw), cy = Math.cos(drone.yaw);
    var fx = -sy, fz = -cy;      // forward
    var rx = cy,  rz = -sy;      // right
    drone.vx += (fx * drone.tiltP + rx * drone.tiltR) * ACC * dt;
    drone.vz += (fz * drone.tiltP + rz * drone.tiltR) * ACC * dt;

    var dragK = Math.max(0, 1 - DRAG * dt);
    drone.vx *= dragK;
    drone.vz *= dragK;

    // Climb rate eases toward the throttle.
    var targetVy = up * CLIMB;
    drone.vy += (targetVy - drone.vy) * Math.min(1, 6 * dt);

    drone.x += drone.vx * dt;
    drone.y += drone.vy * dt;
    drone.z += drone.vz * dt;

    drone.x = clampf(drone.x, 1, W - 1);
    drone.z = clampf(drone.z, 1, D - 1);
    if (drone.y < MIN_ALT) { drone.y = MIN_ALT; if (drone.vy < 0) drone.vy = 0; }
    if (drone.y > 40) { drone.y = 40; if (drone.vy > 0) drone.vy = 0; }

    // Rotors spin faster under load.
    var load = 22 + Math.abs(up) * 14 + (Math.abs(drone.tiltP) + Math.abs(drone.tiltR)) * 8;
    drone.rotorPhase += load * dt;

    // Tower collision: drone body radius ~0.35 against each 1x1
    // column. Any contact = crash = restart.
    var R = 0.35;
    for (var ti = 0; ti < towers.length; ti++) {
      var tw = towers[ti];
      if (drone.x > tw.x - R && drone.x < tw.x + 1 + R &&
          drone.z > tw.z - R && drone.z < tw.z + 1 + R &&
          drone.y - 0.15 < 1 + tw.h) {
        resetDrone();
        break;
      }
    }
  }

  // ---------------------------------------------------------------
  // Main loop
  // ---------------------------------------------------------------
  var SKY = [0.55, 0.75, 0.95];
  gl.clearColor(SKY[0], SKY[1], SKY[2], 1);
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

  gl.uniform1i(loc.uTex, 0);
  gl.uniform3f(loc.uSky, SKY[0], SKY[1], SKY[2]);
  gl.uniform1f(loc.uFogStart, 24.0);
  gl.uniform1f(loc.uFogEnd, 48.0);

  var statEl = document.getElementById("stat");
  var frames = 0, fpsTime = 0, lastFps = 0;
  var statTime = 0;
  var last = now();
  var camYaw = drone.yaw;

  function frame() {
    var t = now();
    var dt = (t - last) / 1000;
    last = t;
    if (dt > 0.1) dt = 0.1;

    resize();
    updateDrone(dt);

    // Chase camera: yaw follows the drone with a little lag,
    // sits behind and above, always looking slightly down at it.
    var dyaw = drone.yaw - camYaw;
    while (dyaw >  Math.PI) dyaw -= 2 * Math.PI;
    while (dyaw < -Math.PI) dyaw += 2 * Math.PI;
    camYaw += dyaw * Math.min(1, 5 * dt);

    var CAM_DIST = 6.0, CAM_PITCH = -0.28;
    var ccp = Math.cos(CAM_PITCH), csp = Math.sin(CAM_PITCH);
    var cfx = -Math.sin(camYaw) * ccp;
    var cfy = csp;
    var cfz = -Math.cos(camYaw) * ccp;

    var ex = drone.x - cfx * CAM_DIST;
    var ey = drone.y - cfy * CAM_DIST;
    var ez = drone.z - cfz * CAM_DIST;
    if (ey < GROUND_Y + 0.3) ey = GROUND_Y + 0.3;

    perspective(proj, 70 * Math.PI / 180, canvas.width / canvas.height, 0.1, 120);
    viewMatrix(view, ex, ey, ez, camYaw, CAM_PITCH);

    gl.uniformMatrix4fv(loc.uProj, false, proj);
    gl.uniformMatrix4fv(loc.uView, false, view);

    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    // World
    gl.uniformMatrix4fv(loc.uModel, false, identity);
    gl.drawElements(gl.TRIANGLES, worldIndexCount, gl.UNSIGNED_SHORT, 0);

    // Blob shadow (blended, hovering just off the grass)
    setTRY(shadowMat, drone.x, GROUND_Y + 0.02, drone.z, drone.yaw);
    gl.enable(gl.BLEND);
    gl.depthMask(false);
    gl.uniformMatrix4fv(loc.uModel, false, shadowMat);
    gl.drawElements(gl.TRIANGLES, shadowCount, gl.UNSIGNED_SHORT, shadowStart * 2);
    gl.depthMask(true);
    gl.disable(gl.BLEND);

    // Drone body: T*Ry(yaw) * Rx(pitch tilt) * Rz(roll tilt).
    // Positive stick pitch = nose down, positive roll = right side down.
    setTRY(bodyMat, drone.x, drone.y, drone.z, drone.yaw);
    setRX(tiltMat, -drone.tiltP * TILT_MAX);
    mul(tmpMat, bodyMat, tiltMat);
    setRZ(tiltMat, -drone.tiltR * TILT_MAX);
    mul(bodyMat, tmpMat, tiltMat);

    gl.uniformMatrix4fv(loc.uModel, false, bodyMat);
    gl.drawElements(gl.TRIANGLES, droneStatics.count, gl.UNSIGNED_SHORT, droneStatics.start * 2);

    for (var ri = 0; ri < rotors.length; ri++) {
      var rp = rotors[ri];
      setTRY(tiltMat, rp.pos[0], rp.pos[1], rp.pos[2],
             (drone.rotorPhase * rp.dir) + rp.phase);
      mul(rotorMat, bodyMat, tiltMat);
      gl.uniformMatrix4fv(loc.uModel, false, rotorMat);
      gl.drawElements(gl.TRIANGLES, rp.count, gl.UNSIGNED_SHORT, rp.start * 2);
    }

    // HUD: fps once a second, alt/speed 4x a second
    frames++;
    fpsTime += dt;
    statTime += dt;
    if (fpsTime >= 1) { lastFps = frames; frames = 0; fpsTime = 0; }
    if (crashFlash > 0) crashFlash -= dt;
    if (statTime >= 0.25) {
      statTime = 0;
      var spd = Math.sqrt(drone.vx * drone.vx + drone.vz * drone.vz);
      statEl.innerHTML = (crashFlash > 0 ? "CRASHED &#183; " : "") +
        lastFps + " fps &#183; alt " +
        (drone.y - GROUND_Y).toFixed(1) + " &#183; spd " + spd.toFixed(1);
    }

    raf(frame);
  }

  resize();
  raf(frame);
})();
</script>
</body>
</html>
