<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RocketChat Navigator</title>
    <link rel="icon" href="https://berrystore.sw7ft.com/apps/app-icons/rocketchat.png" type="image/png">
    <link rel="apple-touch-icon" href="https://berrystore.sw7ft.com/apps/app-icons/rocketchat.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="RocketChat">
    <meta name="theme-color" content="#e33126">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="app-header">
        <button type="button" class="icon-btn" id="btn-menu" title="Rooms">&#9776;</button>
        <h1 class="app-title">RocketChat Navigator</h1>
        <button type="button" class="icon-btn" id="btn-more" title="Menu">&#x22EE;</button>
        <div class="menu-panel" id="menu-panel">
            <button type="button" id="btn-refresh-rooms">Refresh rooms</button>
            <button type="button" id="btn-refresh-chat">Refresh messages</button>
            <button type="button" id="btn-logout" class="danger">Log out</button>
        </div>
    </header>

    <div class="status-bar" id="status-bar">
        <span><span class="status-dot err" id="status-dot"></span><span id="status-text">Connecting...</span></span>
        <span class="status-right">
            <span class="unread-badge" id="unread-badge" style="display:none">0</span>
            <span id="status-user"></span>
        </span>
    </div>
    <div class="notify-bar" id="notify-bar" style="display:none">
        <span class="notify-text" id="notify-text"></span>
        <button type="button" class="notify-dismiss" id="notify-dismiss">&#10005;</button>
    </div>

    <div class="layout">
        <div class="overlay" id="overlay"></div>
        <aside class="sidebar" id="sidebar">
            <div class="search-wrap">
                <input type="text" class="search-input" id="search-input" placeholder="Search rooms...">
            </div>
            <div class="tabs" id="tabs">
                <button type="button" class="tab active" data-filter="all">All</button>
                <button type="button" class="tab" data-filter="channel">Channels</button>
                <button type="button" class="tab" data-filter="group">Groups</button>
                <button type="button" class="tab" data-filter="dm">DMs</button>
            </div>
            <div class="rooms" id="rooms">
                <div class="empty-state" id="rooms-loading">Loading rooms...</div>
            </div>
        </aside>

        <main class="main">
            <div class="chat-header" id="chat-header">
                <h2 class="chat-title" id="chat-title">Select a room</h2>
                <button type="button" class="icon-btn" id="btn-refresh-msg" title="Refresh">&#8635;</button>
            </div>
            <div class="messages-pane">
                <div class="msg-loading" id="msg-loading">
                    <div class="spinner-wheel"></div>
                    <p>Loading messages...</p>
                </div>
                <div class="messages" id="messages">
                    <div class="empty-state" id="empty-chat">
                        Select a channel, group, or direct message to start chatting.
                    </div>
                </div>
            </div>
            <div class="composer">
                <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
                <button type="button" id="send-btn">Send</button>
            </div>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
