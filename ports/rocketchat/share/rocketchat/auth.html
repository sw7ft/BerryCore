<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RocketChat Login</title>
    <link rel="icon" href="https://berrystore.sw7ft.com/apps/app-icons/rocketchat.png" type="image/png">
    <meta name="theme-color" content="#e33126">
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: #0d0d0d;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .brand { text-align: center; margin-bottom: 24px; }
        .brand .icon { font-size: 48px; }
        .brand h1 { margin: 8px 0 4px; font-size: 22px; font-weight: 600; }
        .brand p { margin: 0; color: #888; font-size: 14px; }
        .card {
            background: #161616;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
        }
        label { display: block; font-size: 13px; color: #aaa; margin: 0 0 6px 4px; }
        input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 14px;
            border-radius: 20px;
            border: 1px solid #333;
            background: #222;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus { border-color: #e33126; }
        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 20px;
            background: #e33126;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
        }
        button:disabled { opacity: 0.6; }
        .error { color: #ff6b6b; font-size: 14px; text-align: center; margin-top: 12px; display: none; }
        .hint { font-size: 12px; color: #666; text-align: center; margin-top: 16px; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="brand">
        <div class="icon">&#128640;</div>
        <h1>RocketChat Navigator</h1>
        <p>v3 — BB10 ES5 client</p>
    </div>
    <div class="card">
        <form id="login-form">
            <label for="server_url">Server URL</label>
            <input type="text" id="server_url" name="server_url" placeholder="https://chat.example.com" required>

            <label for="username">Username or email</label>
            <input type="text" id="username" name="username" placeholder="your-username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Password" required>

            <button type="submit" id="submit-btn">Sign in</button>
        </form>
        <div class="error" id="error"></div>
        <p class="hint">Credentials are saved locally on this device in share/rocketchat/.env</p>
    </div>
    <script>
    (function() {
        var form = document.getElementById('login-form');
        var errorEl = document.getElementById('error');
        var submitBtn = document.getElementById('submit-btn');

        form.onsubmit = function(e) {
            e.preventDefault();
            errorEl.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            var payload = JSON.stringify({
                server_url: document.getElementById('server_url').value.trim(),
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value
            });

            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/login', true);
            xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');
            xhr.onreadystatechange = function() {
                if (xhr.readyState !== 4) return;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign in';
                var res;
                try { res = JSON.parse(xhr.responseText); } catch (err) {
                    errorEl.textContent = 'Invalid server response';
                    errorEl.style.display = 'block';
                    return;
                }
                if (xhr.status === 200 && res.next) {
                    window.location.href = res.next;
                    return;
                }
                errorEl.textContent = res.message || 'Login failed';
                errorEl.style.display = 'block';
            };
            xhr.send(payload);
        };
    })();
    </script>
</body>
</html>
